{%- comment -%}
  巡礼帳ふうの記事の表紙。写真3枚をテープで留めたコラージュと、題の札。引数: ids（店のID 3つ、カンマ区切り） / title（札の大きな文字） / sub（札の小さな文字） / color
{%- endcomment -%}
{%- assign _ids = include.ids | split: ',' -%}
<figure class="tcover" style="--g:{{ include.color }}">
  <div class="tcover__photos">
  {%- for _i in _ids %}{% assign _c = site.data.shop_cards[_i] %}{% if _c %}
    <span class="tcover__ph tcover__ph--{{ forloop.index }}">{% if _c.v != '' %}<img src="https://i.ytimg.com/vi_webp/{{ _c.v }}/mqdefault.webp" alt="" width="320" height="180"{% if forloop.first %} fetchpriority="high"{% endif %} decoding="async">{% elsif _c.t != '' %}<img src="{{ _c.t }}" alt="" width="300" height="200" decoding="async">{% endif %}<span class="tcover__cap">{{ _c.n | truncate: 16, '…' }}</span></span>
  {%- endif %}{% endfor %}
  </div>
  <div class="tcover__label"><small>{{ include.sub }}</small><b>{{ include.title }}</b><span class="tcover__no">No.{{ page.date | date: "%y%m" }}</span></div>
</figure>
