# GitHub Pages を GitHub Actions で作って公開する。
# 店舗ページが1万を超え、GitHub Pages 標準の作り方（10分の上限）では間に合わなくなるため。
# 使うには、リポジトリの Settings → Pages → Build and deployment の Source を「GitHub Actions」にする。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - name: Build
        run: bundle exec jekyll build --baseurl "" 
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3

  # GitHub Pages のファイルの同期は actions/deploy-pages の上限10分（600000ms。これより長くはできない）で打ち切られる。
  # ページが1万5千ファイルを超え、同期が10分前後かかるようになった（2026-11-07 に3回時間切れ）ので、時間切れのときは2回までやり直す
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

  deploy-retry:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

  deploy-retry2:
    needs: [build, deploy-retry]
    if: ${{ always() && needs.build.result == 'success' && needs.deploy-retry.result == 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
