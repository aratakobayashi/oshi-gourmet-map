title: 推しグルメ巡礼MAP
description: アイドル・芸人・YouTuberが訪れたグルメスポットを地図で探せる聖地巡礼ガイド
url: "https://gourmet.oshikatsu-guide.com"
baseurl: ""

# 運営者情報（/about/ に表示）
operator_name: "推しグルメ巡礼MAP 編集部"
# お問い合わせフォームのURL（Googleフォーム等）。空の間は「準備中」と表示
contact_form_url: ""
# 参加しているアフィリエイトプログラム（/disclosure/ に表示）。提携が決まったら追記
affiliate_programs: []

# アフィリエイトリンク変換（_includes/affiliate-link.html）
# 提携承認後に管理画面で sid / pid を確認して入力する。空の間は通常リンクのまま出力
affiliate:
  valuecommerce:
    sid: ""
    tabelog_pid: ""
    hotpepper_pid: ""
    ikyu_pid: ""

# ビルド設定
markdown: kramdown
highlighter: rouge
permalink: /articles/:year/:month/:day/:title/
future: true

# コレクション
collections:
  shop_pages:
    output: true
    permalink: /shops/:name/
  list_pages:
    output: true
    permalink: /list/:name/
  group_pages:
    output: true
    permalink: /groups/:name/
  # 推し活ガイド（旧 推し活ガイドブック oshikatsu-guide.com から移行。scripts/migrate_guidebook.py）
  guides:
    output: true
    permalink: /guide/:name/

# プラグイン（GitHub Pages対応）
plugins:
  - jekyll-feed
  - jekyll-sitemap

# デフォルト値
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "編集部"
  - scope:
      path: ""
      type: "shop_pages"
    values:
      layout: "shop"
  - scope:
      path: ""
      type: "list_pages"
    values:
      layout: "list"
  - scope:
      path: ""
      type: "group_pages"
    values:
      layout: "group"
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"
      excerpt_separator: "<!-- excerpt -->"

# 除外ファイル
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - README.md
  - redirects
  - CLAUDE.md
  - scripts/

# SNS / メタ情報
github_username: aratakobayashi

# Google Analytics（任意）
# google_analytics: UA-XXXXXXXX-X

# サイト言語
lang: ja
