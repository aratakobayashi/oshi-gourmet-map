<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 648" width="600" height="648" role="img" aria-label="大阪城ホールの座席のつくり" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>大阪城ホールの座席のつくり</title><rect width="600" height="648" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="28" fill="#241F1A" font-weight="700" text-anchor="start">座席のつくり（断面のイメージ）</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">アリーナ席の配置は公演ごとに変わります</text><rect x="20" y="118" width="560" height="300" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><path d="M40 400 L40 220 Q300 140 560 220 L560 400 Z" fill="#EEF2F7"/><path d="M40 220 Q300 140 560 220" fill="none" stroke="#9AA8BA" stroke-width="4"/><path d="M48 250 L180 300 L180 328 L48 305 Z" fill="#7A4FB5"/><path d="M552 250 L420 300 L420 328 L552 305 Z" fill="#7A4FB5"/><path d="M48 315 L210 365 L210 392 L48 370 Z" fill="#D9822B"/><path d="M552 315 L390 365 L390 392 L552 370 Z" fill="#D9822B"/><rect x="200" y="384" width="200" height="16" fill="#2E8B57"/><rect x="250" y="350" width="100" height="34" rx="4" fill="#3B3346"/><text x="300" y="373" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">ステージの例</text><rect x="30" y="438" width="28" height="28" rx="7" fill="#7A4FB5"/><text x="72" y="460" font-size="22" fill="#241F1A" font-weight="700" text-anchor="start">立見</text><text x="72" y="486" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">2階スタンド後方（22列目の後ろ）</text><rect x="30" y="500" width="28" height="28" rx="7" fill="#D9822B"/><text x="72" y="522" font-size="22" fill="#241F1A" font-weight="700" text-anchor="start">スタンド席（2階）</text><text x="72" y="548" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">A〜Nブロック。座席表で位置を確認</text><rect x="30" y="562" width="28" height="28" rx="7" fill="#2E8B57"/><text x="72" y="584" font-size="22" fill="#241F1A" font-weight="700" text-anchor="start">アリーナ席（1階）</text><text x="72" y="610" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">可動式の席。配置は公演ごと</text></svg>