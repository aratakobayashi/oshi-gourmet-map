<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 534" width="600" height="534" role="img" aria-label="大阪城ホールと最寄り駅の位置関係" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>大阪城ホールと最寄り駅の位置関係</title><rect width="600" height="534" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="30" fill="#241F1A" font-weight="700" text-anchor="start">大阪城ホールと最寄り駅</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">北が上。位置関係のイメージです</text><path d="M560 30 L572 60 L560 53 L548 60 Z" fill="#241F1A"/><text x="560" y="80" font-size="16" fill="#241F1A" font-weight="700" text-anchor="middle">N</text><path d="M470 98 L530 98" stroke="#241F1A" stroke-width="3"/><text x="499.89765201681956" y="90" font-size="15" fill="#6B6258" font-weight="400" text-anchor="middle">500m</text><rect x="20" y="118" width="560" height="320" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><ellipse cx="325" cy="255" rx="26" ry="23" fill="#EEF2F7" stroke="#9AA8BA" stroke-width="3"/><ellipse cx="325" cy="255" rx="18" ry="16" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><ellipse cx="325" cy="255" rx="10" ry="9" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><rect x="259" y="284" width="132" height="32" rx="16" fill="#fff" stroke="#9AA8BA"/><text x="324.6545454546507" y="306.27778446722755" font-size="18" fill="#241F1A" font-weight="700" text-anchor="middle">大阪城ホール</text><line x1="228" y1="191" x2="220" y2="191.12462372060128" stroke="#7A4FB5" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="30" y="159.12462372060128" width="190" height="64" rx="12" fill="#fff" stroke="#7A4FB5" stroke-width="2.5"/><text x="40" y="186.12462372060128" font-size="15" fill="#7A4FB5" font-weight="700" text-anchor="start">JR東西線 大阪城北詰駅</text><text x="40" y="211.12462372060128" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">徒歩15分</text><circle cx="228" cy="191" r="11" fill="#7A4FB5" stroke="#fff" stroke-width="4"/><line x1="318" y1="218" x2="380" y2="217.85550872960323" stroke="#2E8B57" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="380" y="185.85550872960323" width="190" height="64" rx="12" fill="#fff" stroke="#2E8B57" stroke-width="2.5"/><text x="390" y="212.85550872960323" font-size="12" fill="#2E8B57" font-weight="700" text-anchor="start">地下鉄 大阪ビジネスパーク駅</text><text x="390" y="237.85550872960323" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">4番出口・徒歩5分</text><line x1="372" y1="279" x2="380" y2="291.85550872960323" stroke="#2F6FB5" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="380" y="259.85550872960323" width="190" height="64" rx="12" fill="#fff" stroke="#2F6FB5" stroke-width="2.5"/><text x="390" y="286.85550872960323" font-size="19" fill="#2F6FB5" font-weight="700" text-anchor="start">JR 大阪城公園駅</text><text x="390" y="311.85550872960323" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">徒歩5分</text><line x1="347" y1="365" x2="380" y2="365.85550872960323" stroke="#D9822B" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="380" y="333.85550872960323" width="190" height="64" rx="12" fill="#fff" stroke="#D9822B" stroke-width="2.5"/><text x="390" y="360.85550872960323" font-size="17" fill="#D9822B" font-weight="700" text-anchor="start">JR・地下鉄 森ノ宮駅</text><text x="390" y="385.85550872960323" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">徒歩15分</text><circle cx="318" cy="218" r="11" fill="#2E8B57" stroke="#fff" stroke-width="4"/><circle cx="372" cy="279" r="11" fill="#2F6FB5" stroke="#fff" stroke-width="4"/><circle cx="347" cy="365" r="11" fill="#D9822B" stroke="#fff" stroke-width="4"/><rect x="20" y="450" width="560" height="70" rx="12" fill="#FBE6DD"/><text x="36" y="476" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">ホールに駐車場はありません</text><text x="36" y="504" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">北玄関の外側にエレベーターあり</text></svg>