<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 674" width="420" height="674" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="674" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">遠征準備のタイムライン</text>
<text x="20" y="64" font-size="12" fill="#6B6258">当選から帰宅までの5つのステップ</text>
<line x1="52" y1="116" x2="52" y2="584" stroke="#db2777" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="52" cy="116" r="24" fill="#db2777"/><g transform="translate(38,108)"><path d="M0 0h28v6a3 3 0 0 0 0 6v6H0v-6a3 3 0 0 0 0-6z" fill="#fff"/><line x1="18" y1="2" x2="18" y2="16" stroke="#db2777" stroke-width="1.6" stroke-dasharray="2 2"/></g><rect x="92" y="90" width="314" height="90" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="118" font-size="17" font-weight="800" fill="#241F1A">1. 当選したら</text><rect x="352" y="102" width="40" height="22" rx="11" fill="#FCE7F3"/><text x="372.0" y="118" font-size="12" font-weight="700" fill="#db2777" text-anchor="middle">すぐ</text><circle cx="114" cy="141" r="3" fill="#db2777"/><text x="124" y="146" font-size="14" fill="#241F1A">公演日・会場・開演時間を確認</text><circle cx="114" cy="163" r="3" fill="#db2777"/><text x="124" y="168" font-size="14" fill="#241F1A">入金・発券の期限をメモする</text><circle cx="52" cy="222" r="24" fill="#db2777"/><g transform="translate(41,209)"><rect x="0" y="0" width="22" height="22" rx="6" fill="#fff"/><rect x="4" y="4" width="14" height="7" rx="2" fill="#db2777"/><circle cx="6" cy="16" r="2" fill="#db2777"/><circle cx="16" cy="16" r="2" fill="#db2777"/><path d="M4 23l-3 5M18 23l3 5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g><rect x="92" y="196" width="314" height="112" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="224" font-size="17" font-weight="800" fill="#241F1A">2. 交通と宿を予約</text><rect x="340" y="208" width="52" height="22" rx="11" fill="#FCE7F3"/><text x="366.0" y="224" font-size="12" font-weight="700" fill="#db2777" text-anchor="middle">早めに</text><circle cx="114" cy="247" r="3" fill="#db2777"/><text x="124" y="252" font-size="14" fill="#241F1A">新幹線・飛行機・バスを比べる</text><circle cx="114" cy="269" r="3" fill="#db2777"/><text x="124" y="274" font-size="14" fill="#241F1A">日帰りか泊まりかを決める</text><circle cx="114" cy="291" r="3" fill="#db2777"/><text x="124" y="296" font-size="14" fill="#241F1A">宿は会場までの行き方も見る</text><circle cx="52" cy="350" r="24" fill="#db2777"/><g transform="translate(40,338)"><path d="M7 7V4a5 5 0 0 1 10 0v3" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="0" y="7" width="24" height="19" rx="5" fill="#fff"/><rect x="5" y="13" width="14" height="3" rx="1.5" fill="#db2777"/></g><rect x="92" y="324" width="314" height="112" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="352" font-size="17" font-weight="800" fill="#241F1A">3. 前日まで</text><rect x="352" y="336" width="40" height="22" rx="11" fill="#FCE7F3"/><text x="372.0" y="352" font-size="12" font-weight="700" fill="#db2777" text-anchor="middle">準備</text><circle cx="114" cy="375" r="3" fill="#db2777"/><text x="124" y="380" font-size="14" fill="#241F1A">主催者の案内を読み直す</text><circle cx="114" cy="397" r="3" fill="#db2777"/><text x="124" y="402" font-size="14" fill="#241F1A">チケットのアプリにログイン</text><circle cx="114" cy="419" r="3" fill="#db2777"/><text x="124" y="424" font-size="14" fill="#241F1A">スマホと電池を満タンに</text><circle cx="52" cy="478" r="24" fill="#db2777"/><polygon points="52.0,466.0 55.3,474.5 64.4,475.0 57.3,480.7 59.6,489.5 52.0,484.6 44.4,489.5 46.7,480.7 39.6,475.0 48.7,474.5" fill="#fff"/><rect x="92" y="452" width="314" height="90" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="480" font-size="17" font-weight="800" fill="#241F1A">4. 当日</text><rect x="352" y="464" width="40" height="22" rx="11" fill="#FCE7F3"/><text x="372.0" y="480" font-size="12" font-weight="700" fill="#db2777" text-anchor="middle">本番</text><circle cx="114" cy="503" r="3" fill="#db2777"/><text x="124" y="508" font-size="14" fill="#241F1A">時間に余裕をもって出発</text><circle cx="114" cy="525" r="3" fill="#db2777"/><text x="124" y="530" font-size="14" fill="#241F1A">大きな荷物は先に預ける</text><circle cx="52" cy="584" r="24" fill="#db2777"/><g transform="translate(39,572)"><path d="M13 0L26 11h-4v15H4V11H0z" fill="#fff"/><rect x="10" y="16" width="6" height="10" rx="1" fill="#db2777"/></g><rect x="92" y="558" width="314" height="90" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="586" font-size="17" font-weight="800" fill="#241F1A">5. 帰宅まで</text><rect x="328" y="570" width="64" height="22" rx="11" fill="#FCE7F3"/><text x="360.0" y="586" font-size="12" font-weight="700" fill="#db2777" text-anchor="middle">最後まで</text><circle cx="114" cy="609" r="3" fill="#db2777"/><text x="124" y="614" font-size="14" fill="#241F1A">終電・帰りの便を確かめる</text><circle cx="114" cy="631" r="3" fill="#db2777"/><text x="124" y="636" font-size="14" fill="#241F1A">宿を出る前に忘れ物チェック</text></svg>
