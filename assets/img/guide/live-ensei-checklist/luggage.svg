<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 724" width="420" height="724" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="724" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">大きな荷物の預け方</text>
<text x="20" y="64" font-size="12" fill="#6B6258">会場へは身軽に。預け先は3つから選ぶ</text>
<rect x="70" y="84" width="280" height="52" rx="12" fill="#db2777" stroke="#db2777" stroke-width="1"/><text x="210" y="116" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">大きな荷物がある？</text><path d="M210 136v14H64v12M210 150h146v12" fill="none" stroke="#db2777" stroke-width="3"/><path d="M57 158l7 9 7-9zM349 158l7 9 7-9z" fill="#db2777"/><rect x="104" y="139" width="48" height="22" rx="11" fill="#fff" stroke="#db2777" stroke-width="2"/><text x="128" y="155" font-size="13" font-weight="700" fill="#db2777" text-anchor="middle">ない</text><rect x="268" y="139" width="48" height="22" rx="11" fill="#fff" stroke="#db2777" stroke-width="2"/><text x="292" y="155" font-size="13" font-weight="700" fill="#db2777" text-anchor="middle">ある</text><rect x="16" y="172" width="150" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="91" y="200" font-size="15" font-weight="800" fill="#241F1A" text-anchor="middle">そのまま会場へ</text><text x="91" y="224" font-size="13" fill="#6B6258" text-anchor="middle">小さめのバッグで</text><text x="91" y="244" font-size="13" fill="#6B6258" text-anchor="middle">身軽に入場</text><rect x="186" y="172" width="218" height="96" rx="12" fill="#FCE7F3" stroke="#db2777" stroke-width="2"/><text x="295" y="200" font-size="15" font-weight="800" fill="#241F1A" text-anchor="middle">会場に着く前に預ける</text><text x="295" y="224" font-size="13" fill="#6B6258" text-anchor="middle">会場のロッカーは数が限られ</text><text x="295" y="244" font-size="13" fill="#6B6258" text-anchor="middle">公式が駅・宿を案内する会場も</text><line x1="295" y1="270" x2="295" y2="285" stroke="#db2777" stroke-width="3" stroke-linecap="round"/><path d="M288 283l7 9 7-9z" fill="#db2777"/><rect x="16" y="296" width="388" height="82" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="337.0" r="22" fill="#db2777"/><g transform="translate(39,325.0)"><path d="M13 0L26 11h-4v15H4V11H0z" fill="#fff"/><rect x="10" y="16" width="6" height="10" rx="1" fill="#db2777"/></g><text x="88" y="323" font-size="16" font-weight="800" fill="#241F1A">A. 宿に預ける</text><text x="88" y="346" font-size="14" fill="#6B6258">チェックイン前でも預かって</text><text x="88" y="367" font-size="14" fill="#6B6258">もらえるか、宿に先に確認</text><rect x="16" y="388" width="388" height="82" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="429.0" r="22" fill="#db2777"/><g transform="translate(39,417.0)"><rect x="0" y="0" width="26" height="26" rx="3" fill="#fff"/><line x1="13" y1="0" x2="13" y2="26" stroke="#db2777" stroke-width="1.6"/><line x1="0" y1="13" x2="26" y2="13" stroke="#db2777" stroke-width="1.6"/><circle cx="9.5" cy="6.5" r="1.4" fill="#db2777"/><circle cx="22.5" cy="6.5" r="1.4" fill="#db2777"/><circle cx="9.5" cy="19.5" r="1.4" fill="#db2777"/><circle cx="22.5" cy="19.5" r="1.4" fill="#db2777"/></g><text x="88" y="415" font-size="16" font-weight="800" fill="#241F1A">B. 駅のコインロッカー</text><text x="88" y="438" font-size="14" fill="#6B6258">数に限りがあるので早めに</text><text x="88" y="459" font-size="14" fill="#6B6258">サイズと支払い方法も確認</text><rect x="16" y="480" width="388" height="124" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="542.0" r="22" fill="#db2777"/><g transform="translate(37,532.0)"><rect x="0" y="0" width="19" height="16" rx="2" fill="#fff"/><path d="M20 5h6l4 5v6H20z" fill="#fff"/><circle cx="7" cy="19" r="3.4" fill="#fff" stroke="#db2777" stroke-width="1.6"/><circle cx="24" cy="19" r="3.4" fill="#fff" stroke="#db2777" stroke-width="1.6"/></g><text x="88" y="507" font-size="16" font-weight="800" fill="#241F1A">C. 宿へ送る</text><text x="88" y="530" font-size="14" fill="#6B6258">ヤマト運輸の往復宅急便は</text><text x="88" y="551" font-size="14" fill="#6B6258">宿泊の2日前までに発送</text><text x="88" y="572" font-size="14" fill="#6B6258">（一部地域は3日前）</text><text x="88" y="593" font-size="14" fill="#6B6258">帰りは宿から自宅へ送れる</text><rect x="16" y="616" width="388" height="90" rx="12" fill="#fff" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5 4"/><g transform="translate(35,646)"><rect x="0" y="0" width="22" height="22" rx="6" fill="#db2777"/><rect x="4" y="4" width="14" height="7" rx="2" fill="#fff"/><circle cx="6" cy="16" r="2" fill="#fff"/><circle cx="16" cy="16" r="2" fill="#db2777"/><path d="M4 23l-3 5M18 23l3 5" stroke="#db2777" stroke-width="2.4" stroke-linecap="round"/></g><text x="76" y="642" font-size="14" font-weight="800" fill="#241F1A">新幹線で大きなスーツケースなら</text><text x="76" y="664" font-size="14" fill="#241F1A">東海道・山陽・九州新幹線は3辺の</text><text x="76" y="685" font-size="14" fill="#241F1A">合計160cm超で座席の予約が必要</text></svg>
