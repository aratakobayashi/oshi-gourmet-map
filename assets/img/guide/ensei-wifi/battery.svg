<text x="80" y="458" font-size="15" font-weight="800" fill="#0891b2" text-anchor="start">飛行機で行くとき（国土交通省）</text>
<text x="36" y="486" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">・モバイルバッテリーは預け入れ禁止。</text>
<text x="36" y="508" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">　機内に持ち込む</text>
<text x="36" y="530" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">・機内持ち込みは2個まで（160Wh以下）</text>
<text x="36" y="552" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">・機内でバッテリーの充電も、バッテリー</text>
<text x="36" y="574" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">　からの充電もしない（2026年4月24日〜）</text>
<text x="36" y="596" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">・座席上の収納棚に入れず手元に</text>
