<text x="44" y="332" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="64" y="332" font-size="14" font-weight="700" fill="#241F1A" text-anchor="start">大きな公演では何万人もが同じ場所に集まる</text>
