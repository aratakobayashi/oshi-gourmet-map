<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 596" width="420" height="596" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="596" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">投稿する前の5つのチェック</text>
<text x="20" y="64" font-size="12" fill="#6B6258">送信ボタンを押す前に、ひと呼吸</text>
<line x1="52" y1="128" x2="52" y2="528" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="52" cy="128" r="24" fill="#0ea5e9"/><g transform="translate(40,116)"><path d="M2 7h5l2-3h6l2 3h5v14H2z" fill="#fff"/><circle cx="12" cy="13.5" r="4.6" fill="#0ea5e9"/><circle cx="12" cy="13.5" r="2.6" fill="#fff"/></g><rect x="92" y="88" width="314" height="86" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="116" font-size="17" fill="#241F1A" font-weight="800">1. その画像、だれのもの？</text><circle cx="114" cy="137.1" r="3" fill="#0ea5e9"/><text x="124" y="142" font-size="14" fill="#241F1A">公式画像・雑誌・番組は転載しない</text><circle cx="114" cy="159.1" r="3" fill="#0ea5e9"/><text x="124" y="164" font-size="14" fill="#241F1A">広めるなら公式の投稿を共有機能で</text><circle cx="52" cy="228" r="24" fill="#0ea5e9"/><g transform="translate(40,216)"><circle cx="12" cy="7" r="5" fill="#fff"/><path d="M2.5 23a9.5 9 0 0 1 19 0z" fill="#fff"/></g><rect x="92" y="188" width="314" height="86" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="216" font-size="17" fill="#241F1A" font-weight="800">2. ほかの人が写っていない？</text><circle cx="114" cy="237.1" r="3" fill="#0ea5e9"/><text x="124" y="242" font-size="14" fill="#241F1A">友だちや周りの人の顔・名前</text><circle cx="114" cy="259.1" r="3" fill="#0ea5e9"/><text x="124" y="264" font-size="14" fill="#241F1A">載せるなら本人の了承をとる</text><circle cx="52" cy="328" r="24" fill="#0ea5e9"/><g transform="translate(40,316)"><path d="M12 23s8-8.2 8-13.5a8 8 0 0 0-16 0C4 14.8 12 23 12 23z" fill="#fff"/><circle cx="12" cy="9.5" r="3.2" fill="#0ea5e9"/></g><rect x="92" y="288" width="314" height="86" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="316" font-size="17" fill="#241F1A" font-weight="800">3. 場所がわからない？</text><circle cx="114" cy="337.1" r="3" fill="#0ea5e9"/><text x="124" y="342" font-size="14" fill="#241F1A">背景の看板・窓の景色・位置情報</text><circle cx="114" cy="359.1" r="3" fill="#0ea5e9"/><text x="124" y="364" font-size="14" fill="#241F1A">その場で投稿せず、時間をずらす</text><circle cx="52" cy="428" r="24" fill="#0ea5e9"/><g transform="translate(40,416)"><rect x="8" y="1" width="8" height="13" rx="4" fill="#fff"/><path d="M4.5 11a7.5 7.5 0 0 0 15 0M12 18.5V23M8 23h8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><rect x="92" y="388" width="314" height="86" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="416" font-size="17" fill="#241F1A" font-weight="800">4. 公演の決まりを守っている？</text><circle cx="114" cy="437.1" r="3" fill="#0ea5e9"/><text x="124" y="442" font-size="14" fill="#241F1A">撮影・録音は主催者の案内のとおりに</text><circle cx="114" cy="459.1" r="3" fill="#0ea5e9"/><text x="124" y="464" font-size="14" fill="#241F1A">ネタバレは前置きをつけて</text><circle cx="52" cy="528" r="24" fill="#0ea5e9"/><g transform="translate(40,516)"><path d="M12 22S1.5 15 1.5 8.2A5.3 5.3 0 0 1 12 6a5.3 5.3 0 0 1 10.5 2.2C22.5 15 12 22 12 22z" fill="#fff"/></g><rect x="92" y="488" width="314" height="86" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="516" font-size="17" fill="#241F1A" font-weight="800">5. だれかを傷つけない？</text><circle cx="114" cy="537.1" r="3" fill="#0ea5e9"/><text x="124" y="542" font-size="14" fill="#241F1A">悪口は投稿も拡散もしない</text><circle cx="114" cy="559.1" r="3" fill="#0ea5e9"/><text x="124" y="564" font-size="14" fill="#241F1A">腹が立ったら、いったん下書きに</text></svg>
