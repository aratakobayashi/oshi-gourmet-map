<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 572" width="420" height="572" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="572" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">ネタバレ、どう気づかう？</text>
<text x="20" y="64" font-size="12" fill="#6B6258">ツアー中の公演や公開中の作品の感想を書くとき</text>
<rect x="16" y="86" width="388" height="110" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="32" y="114" font-size="15" fill="#241F1A" font-weight="800">ツアーの間は、まだ見ていない人がいる</text><line x1="44" y1="152" x2="376" y2="152" stroke="#E2D9CC" stroke-width="6" stroke-linecap="round"/><line x1="44" y1="152" x2="300" y2="152" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/><circle cx="44" cy="152" r="8" fill="#fff" stroke="#0ea5e9" stroke-width="4"/><text x="44" y="182" font-size="13" fill="#241F1A" font-weight="700" text-anchor="middle">初日</text><circle cx="172" cy="152" r="8" fill="#fff" stroke="#0ea5e9" stroke-width="4"/><text x="172" y="182" font-size="13" fill="#241F1A" font-weight="700" text-anchor="middle">ツアー中</text><circle cx="300" cy="152" r="8" fill="#fff" stroke="#0ea5e9" stroke-width="4"/><text x="300" y="182" font-size="13" fill="#241F1A" font-weight="700" text-anchor="middle">最終日</text><circle cx="376" cy="152" r="8" fill="#fff" stroke="#B8AC9C" stroke-width="4"/><text x="376" y="182" font-size="13" fill="#241F1A" font-weight="700" text-anchor="middle">その後</text><rect x="118" y="122" width="130" height="22" rx="11.0" fill="#DBF2FC"/><text x="183.0" y="136" font-size="12" fill="#0ea5e9" font-weight="700" text-anchor="middle">とくに気づかう期間</text><rect x="16" y="212" width="388" height="160" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><path d="M16 224a12 12 0 0 1 12-12h364a12 12 0 0 1 12 12v24H16z" fill="#0ea5e9"/><text x="32" y="237" font-size="16" fill="#fff" font-weight="800">書く人ができること</text><g transform="translate(358,218)"><path d="M3 21l1.2-5.2L16 4l4 4L8.2 19.8z" fill="#fff"/><path d="M14 6l4 4" stroke="#fff" stroke-width="1.6"/></g><circle cx="34" cy="263.1" r="3" fill="#0ea5e9"/><text x="44" y="268" font-size="14" fill="#241F1A">1行目に「ネタバレあり」と書く</text><circle cx="34" cy="289.1" r="3" fill="#0ea5e9"/><text x="44" y="294" font-size="14" fill="#241F1A">大事な内容を最初の文や画像にしない</text><circle cx="34" cy="315.1" r="3" fill="#0ea5e9"/><text x="44" y="320" font-size="14" fill="#241F1A">まとめて書くなら公演が終わってから</text><circle cx="34" cy="341.1" r="3" fill="#0ea5e9"/><text x="44" y="346" font-size="14" fill="#241F1A">公式がタグを決めていればそれに従う</text><rect x="16" y="386" width="388" height="132" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><path d="M16 398a12 12 0 0 1 12-12h364a12 12 0 0 1 12 12v24H16z" fill="#DBF2FC"/><text x="32" y="411" font-size="16" fill="#0ea5e9" font-weight="800">見たくない人ができること</text><g transform="translate(358,392)"><path d="M2 9h4l6-5v16l-6-5H2z" fill="#0ea5e9"/><path d="M15.5 9l6 6M21.5 9l-6 6" stroke="#0ea5e9" stroke-width="2.4" stroke-linecap="round"/></g><circle cx="34" cy="437.1" r="3" fill="#0ea5e9"/><text x="44" y="442" font-size="14" fill="#241F1A">公演名やタグをミュートする</text><circle cx="34" cy="463.1" r="3" fill="#0ea5e9"/><text x="44" y="468" font-size="14" fill="#241F1A">見終わるまで検索で調べない</text><circle cx="34" cy="489.1" r="3" fill="#0ea5e9"/><text x="44" y="494" font-size="14" fill="#241F1A">Xのミュートは通知とホームに効く</text><text x="20" y="548" font-size="13" fill="#6B6258">ミュートの使い方は各SNSの公式ヘルプで確認</text></svg>
