<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 610" width="420" height="610" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="610" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">困ったときの相談先</text>
<text x="20" y="64" font-size="12" fill="#6B6258">書き込み・チケット・お金のトラブル</text>
<rect x="16" y="84" width="388" height="84" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="32" y="110" font-size="15" fill="#241F1A" font-weight="800">嫌な投稿を見つけたら</text><rect x="40" y="124" width="84" height="32" rx="16" fill="#DDF2FC"/><text x="82.0" y="145" font-size="14" fill="#0ea5e9" font-weight="800" text-anchor="middle">広めない</text><path d="M131 140h12m-5-5l5 5-5 5" fill="none" stroke="#0ea5e9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="154" y="124" width="124" height="32" rx="16" fill="#DDF2FC"/><text x="216.0" y="145" font-size="14" fill="#0ea5e9" font-weight="800" text-anchor="middle">通報・ブロック</text><path d="M285 140h12m-5-5l5 5-5 5" fill="none" stroke="#0ea5e9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="308" y="124" width="84" height="32" rx="16" fill="#0ea5e9"/><text x="350.0" y="145" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">相談する</text><rect x="16" y="184" width="388" height="86" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="50" cy="227" r="20" fill="#0ea5e9"/><g transform="translate(38,215)"><path d="M2 3h20v14H9l-5 5v-5H2z" fill="#fff"/><circle cx="7.5" cy="10" r="1.6" fill="#0ea5e9"/><circle cx="12" cy="10" r="1.6" fill="#0ea5e9"/><circle cx="16.5" cy="10" r="1.6" fill="#0ea5e9"/></g><text x="84" y="209" font-size="13" fill="#6B6258" font-weight="700">誹謗中傷・無断で載った写真</text><text x="84" y="234" font-size="16" fill="#241F1A" font-weight="800">違法・有害情報相談センター</text><text x="84" y="256" font-size="13" fill="#6B6258">削除の方法などを相談（総務省の委託事業）</text><rect x="16" y="282" width="388" height="86" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="50" cy="325" r="20" fill="#0ea5e9"/><g transform="translate(38,313)"><path d="M12 1l9.5 3.5v6.5c0 6-4 10.5-9.5 12C6.5 21.5 2.5 17 2.5 11V4.5z" fill="#fff"/><path d="M7.5 12l3 3 6-6.5" fill="none" stroke="#0ea5e9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84" y="307" font-size="13" fill="#6B6258" font-weight="700">ネット上の人権侵害</text><text x="84" y="332" font-size="16" fill="#241F1A" font-weight="800">法務省インターネット人権相談</text><text x="84" y="354" font-size="13" fill="#6B6258">フォームから送ると法務局が回答</text><rect x="16" y="380" width="388" height="86" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="50" cy="423" r="20" fill="#0ea5e9"/><g transform="translate(38,411)"><path d="M1 5h22v5a2.5 2.5 0 0 0 0 5v5H1v-5a2.5 2.5 0 0 0 0-5z" fill="#fff"/><path d="M16 7v11" stroke="#0ea5e9" stroke-width="1.6" stroke-dasharray="2 2"/></g><text x="84" y="405" font-size="13" fill="#6B6258" font-weight="700">チケット・買い物のトラブル</text><text x="84" y="430" font-size="16" fill="#241F1A" font-weight="800">消費者ホットライン「188」</text><text x="84" y="452" font-size="13" fill="#6B6258">近くの消費生活相談窓口につながる</text><rect x="16" y="478" width="388" height="86" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="50" cy="521" r="20" fill="#0ea5e9"/><g transform="translate(38,509)"><path d="M5 1.5l4 1 1.5 5-2.5 2a13 13 0 0 0 6.5 6.5l2-2.5 5 1.5 1 4c-.5 2-2.5 3-4.5 2.8C9.5 21 3 14.5 2.2 6 2 4 3 2 5 1.5z" fill="#fff"/></g><text x="84" y="503" font-size="13" fill="#6B6258" font-weight="700">お金をだまし取られたかも</text><text x="84" y="528" font-size="16" fill="#241F1A" font-weight="800">警察相談専用電話「#9110」</text><text x="84" y="550" font-size="13" fill="#6B6258">すぐに相談を（国民生活センターの案内）</text><text x="20" y="592" font-size="12" fill="#6B6258">出典：総務省、国民生活センター、違法・有害情報相談センター</text></svg>
