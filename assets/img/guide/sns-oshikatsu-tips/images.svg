<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 602" width="420" height="602" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="602" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">推しの画像、どう扱う？</text>
<text x="20" y="64" font-size="12" fill="#6B6258">出典：文化庁「著作権、これってOK？NG？」、総務省</text>
<circle cx="30" cy="94" r="8" fill="none" stroke="#0ea5e9" stroke-width="3.2"/><text x="44" y="99" font-size="13" fill="#241F1A" font-weight="700">OK</text><path d="M98 83l13 23h-26z" fill="none" stroke="#B45309" stroke-width="3" stroke-linejoin="round"/><text x="116" y="99" font-size="13" fill="#241F1A" font-weight="700">条件つき</text><path d="M189 87l14 14M203 87l-14 14" stroke="#B91C1C" stroke-width="3.6" stroke-linecap="round"/><text x="210" y="99" font-size="13" fill="#241F1A" font-weight="700">NG（原則）</text><rect x="16" y="120" width="388" height="62" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="46" cy="151" r="13" fill="none" stroke="#0ea5e9" stroke-width="3.2"/><text x="76" y="147" font-size="15" fill="#241F1A" font-weight="700">公式の投稿を共有機能で広める</text><text x="76" y="168" font-size="13" fill="#6B6258">リポスト・シェア・埋め込みなど</text><rect x="16" y="192" width="388" height="62" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="46" cy="223" r="13" fill="none" stroke="#0ea5e9" stroke-width="3.2"/><text x="76" y="219" font-size="15" fill="#241F1A" font-weight="700">撮影OKの場所で、自分が撮った写真</text><text x="76" y="240" font-size="13" fill="#6B6258">ほかの人や場所の写り込みに注意</text><rect x="16" y="264" width="388" height="62" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><path d="M46 285l13 23h-26z" fill="none" stroke="#B45309" stroke-width="3" stroke-linejoin="round"/><text x="76" y="291" font-size="15" fill="#241F1A" font-weight="700">公式が撮影・投稿を認めた公演</text><text x="76" y="312" font-size="13" fill="#6B6258">認められた範囲・条件の中で</text><rect x="16" y="336" width="388" height="62" rx="12" fill="#FFF7F7" stroke="#F3D4D4" stroke-width="1"/><path d="M36 357l20 20M56 357l-20 20" stroke="#B91C1C" stroke-width="3.6" stroke-linecap="round"/><text x="76" y="363" font-size="15" fill="#241F1A" font-weight="700">無許可のライブ写真・動画を公開</text><text x="76" y="384" font-size="13" fill="#6B6258">SNSでの公開は私的使用の範囲外</text><rect x="16" y="408" width="388" height="62" rx="12" fill="#FFF7F7" stroke="#F3D4D4" stroke-width="1"/><path d="M36 429l20 20M56 429l-20 20" stroke="#B91C1C" stroke-width="3.6" stroke-linecap="round"/><text x="76" y="435" font-size="15" fill="#241F1A" font-weight="700">雑誌・番組・公式画像の転載や加工</text><text x="76" y="456" font-size="13" fill="#6B6258">使うには権利者の許可が必要</text><rect x="16" y="480" width="388" height="62" rx="12" fill="#FFF7F7" stroke="#F3D4D4" stroke-width="1"/><path d="M36 501l20 20M56 501l-20 20" stroke="#B91C1C" stroke-width="3.6" stroke-linecap="round"/><text x="76" y="507" font-size="15" fill="#241F1A" font-weight="700">ネットの「拾い画」をアイコンに</text><text x="76" y="528" font-size="13" fill="#6B6258">権利者の意思にしたがう</text><text x="20" y="574" font-size="13" fill="#6B6258">扱いの決まりは事務所・公式ごとに違います。公式の案内を確認</text></svg>
