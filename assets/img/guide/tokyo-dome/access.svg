<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 790" width="600" height="790" role="img" aria-label="東京ドームと最寄り4駅の位置関係" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>東京ドームと最寄り4駅の位置関係</title><rect width="600" height="790" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="30" fill="#241F1A" font-weight="700" text-anchor="start">東京ドームと最寄り4駅</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">北が上。位置関係のイメージです</text><rect x="20" y="118" width="560" height="582" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><path d="M180 119 L180 699" stroke="#E2D9CC" stroke-width="20"/><text x="190" y="268" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">白山通り</text><path d="M21 680 L579 680" stroke="#D6E6F5" stroke-width="18"/><text x="34" y="668" font-size="17" fill="#6B6258" font-weight="400" text-anchor="start">神田川（南側）</text><ellipse cx="300" cy="390" rx="70" ry="64" fill="#EEF2F7" stroke="#9AA8BA" stroke-width="3"/><ellipse cx="300" cy="390" rx="53" ry="49" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><ellipse cx="300" cy="390" rx="36" ry="34" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><ellipse cx="300" cy="390" rx="19" ry="19" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><text x="300" y="399" font-size="24" fill="#241F1A" font-weight="700" text-anchor="middle">東京ドーム</text><path d="M530 330 L544 366 L530 358 L516 366 Z" fill="#241F1A"/><text x="530" y="390" font-size="18" fill="#241F1A" font-weight="700" text-anchor="middle">N</text><path d="M490 430 L540 430" stroke="#241F1A" stroke-width="3"/><text x="515.0" y="420" font-size="16" fill="#6B6258" font-weight="400" text-anchor="middle">100m</text><line x1="378" y1="594" x2="445" y2="612" stroke="#2F6FB5" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="378" cy="594" r="11" fill="#2F6FB5" stroke="#fff" stroke-width="4"/><rect x="320" y="612" width="250" height="64" rx="12" fill="#fff" stroke="#2F6FB5" stroke-width="2.5"/><text x="334" y="640" font-size="21" fill="#2F6FB5" font-weight="700" text-anchor="start">JR 水道橋駅</text><text x="334" y="666" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">西口（東口もあり）</text><line x1="323" y1="512" x2="155" y2="534" stroke="#2E8B57" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="323" cy="512" r="11" fill="#2E8B57" stroke="#fff" stroke-width="4"/><rect x="30" y="470" width="250" height="64" rx="12" fill="#fff" stroke="#2E8B57" stroke-width="2.5"/><text x="44" y="498" font-size="21" fill="#2E8B57" font-weight="700" text-anchor="start">都営三田線 水道橋駅</text><text x="44" y="524" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">A2出口</text><line x1="247" y1="310" x2="155" y2="242" stroke="#D9822B" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="247" cy="310" r="11" fill="#D9822B" stroke="#fff" stroke-width="4"/><rect x="30" y="178" width="250" height="64" rx="12" fill="#fff" stroke="#D9822B" stroke-width="2.5"/><text x="44" y="206" font-size="21" fill="#D9822B" font-weight="700" text-anchor="start">東京メトロ 後楽園駅</text><text x="44" y="232" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">2番出口</text><line x1="299" y1="245" x2="445" y2="242" stroke="#7A4FB5" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="299" cy="245" r="11" fill="#7A4FB5" stroke="#fff" stroke-width="4"/><rect x="320" y="178" width="250" height="64" rx="12" fill="#fff" stroke="#7A4FB5" stroke-width="2.5"/><text x="334" y="206" font-size="21" fill="#7A4FB5" font-weight="700" text-anchor="start">都営大江戸線 春日駅</text><text x="334" y="232" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">6番出口</text><rect x="20" y="714" width="560" height="62" rx="12" fill="#FBE6DD"/><text x="36" y="740" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">JR水道橋駅の西口はエレベーターなし</text><text x="36" y="766" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">段差を避けるなら東口か後楽園駅から</text></svg>