<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" role="img" aria-label="東京ドームの座席のつくり" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>東京ドームの座席のつくり</title><rect width="600" height="700" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="28" fill="#241F1A" font-weight="700" text-anchor="start">座席のつくり（断面のイメージ）</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">アリーナ席の並びは公演ごとに変わります</text><rect x="20" y="118" width="560" height="300" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><path d="M40 400 L40 220 Q300 110 560 220 L560 400 Z" fill="#EEF2F7"/><path d="M40 220 Q300 110 560 220" fill="none" stroke="#9AA8BA" stroke-width="4"/><path d="M48 258 L150 306 L150 324 L48 286 Z" fill="#7A4FB5"/><path d="M552 258 L450 306 L450 324 L552 286 Z" fill="#7A4FB5"/><rect x="48" y="296" width="56" height="12" rx="4" fill="#D9822B"/><rect x="496" y="296" width="56" height="12" rx="4" fill="#D9822B"/><path d="M48 326 L190 384 L190 400 L48 400 Z" fill="#2F6FB5"/><path d="M552 326 L410 384 L410 400 L552 400 Z" fill="#2F6FB5"/><rect x="190" y="384" width="220" height="16" fill="#2E8B57"/><rect x="250" y="350" width="100" height="34" rx="4" fill="#3B3346"/><text x="300" y="373" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">ステージの例</text><rect x="30" y="438" width="28" height="28" rx="7" fill="#7A4FB5"/><text x="72" y="460" font-size="22" fill="#241F1A" font-weight="700" text-anchor="start">2階席スタンド</text><text x="72" y="486" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">4階コンコースから入る</text><rect x="30" y="500" width="28" height="28" rx="7" fill="#D9822B"/><text x="72" y="522" font-size="22" fill="#241F1A" font-weight="700" text-anchor="start">バルコニー席</text><text x="72" y="548" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">プレミアムラウンジ</text><rect x="30" y="562" width="28" height="28" rx="7" fill=