<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 558" width="420" height="558" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="558" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">SNSで推し活を楽しむために</text>
<text x="20" y="64" font-size="12" fill="#6B6258">出典：文化庁「著作権、これってOK？NG？」ほか</text>
<rect x="16" y="84" width="388" height="194" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><path d="M16 96a12 12 0 0 1 12-12h364a12 12 0 0 1 12 12v28H16z" fill="#f97316"/><g transform="translate(30,92)"><path d="M4 12.5l5 5L20 6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="111" font-size="17" fill="#fff" font-weight="800">楽しくできること</text><circle cx="42" cy="149" r="11" fill="#FEEDE1"/><path d="M36 149l4 4 8-8" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="154" font-size="15" fill="#241F1A">公式の投稿をシェアする</text><circle cx="42" cy="185" r="11" fill="#FEEDE1"/><path d="M36 185l4 4 8-8" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="190" font-size="15" fill="#241F1A">自分の言葉で感想を書く</text><circle cx="42" cy="221" r="11" fill="#FEEDE1"/><path d="M36 221l4 4 8-8" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="226" font-size="15" fill="#241F1A">公式が撮影OKとした範囲で</text><circle cx="42" cy="257" r="11" fill="#FEEDE1"/><path d="M36 257l4 4 8-8" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="262" font-size="15" fill="#241F1A">見たくない話題はミュートで</text><rect x="16" y="292" width="388" height="194" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><path d="M16 304a12 12 0 0 1 12-12h364a12 12 0 0 1 12 12v28H16z" fill="#241F1A"/><g transform="translate(30,300)"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></g><text x="64" y="319" font-size="17" fill="#fff" font-weight="800">気をつけたいこと</text><circle cx="42" cy="357" r="11" fill="#241F1A"/><path d="M37.5 352.5l9 9M46.5 352.5l-9 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><text x="64" y="362" font-size="15" fill="#241F1A">無許可でライブ動画を公開</text><circle cx="42" cy="393" r="11" fill="#241F1A"/><path d="M37.5 388.5l9 9M46.5 388.5l-9 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><text x="64" y="398" font-size="15" fill="#241F1A">拾い画をアイコンに使う</text><circle cx="42" cy="429" r="11" fill="#241F1A"/><path d="M37.5 424.5l9 9M46.5 424.5l-9 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><text x="64" y="434" font-size="15" fill="#241F1A">公式画像を無断で転載</text><circle cx="42" cy="465" r="11" fill="#241F1A"/><path d="M37.5 460.5l9 9M46.5 460.5l-9 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><text x="64" y="470" font-size="15" fill="#241F1A">公演内容のネタバレ</text><rect x="16" y="500" width="388" height="40" rx="12" fill="#FEEDE1"/><text x="210" y="526" font-size="14" fill="#C2410C" font-weight="800" text-anchor="middle">撮影できるかは、公演ごとに主催者が決める</text></svg>
