<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">推しができたら最初にやること</text>
<text x="20" y="64" font-size="12" fill="#6B6258">上から順に。できるものからでOK</text>
<line x1="44" y1="114" x2="44" y2="498" stroke="#f97316" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="44" cy="114" r="22" fill="#f97316"/><g transform="translate(32,102)"><path d="M12 2a6 6 0 0 1 6 6v5l2.5 4h-17L6 13V8a6 6 0 0 1 6-6z" fill="#fff"/><circle cx="12" cy="20" r="2.5" fill="#fff"/></g><rect x="80" y="88" width="324" height="54" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="96" y="111" font-size="16" fill="#241F1A" font-weight="800">1. 公式をフォロー</text><text x="96" y="132" font-size="13" fill="#4A423A">公式サイト・SNS・YouTube</text><circle cx="44" cy="178" r="22" fill="#f97316"/><g transform="translate(32,166)"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" fill="#fff"/><circle cx="12" cy="12" r="4" fill="#f97316"/><circle cx="12" cy="12" r="2" fill="#fff"/></g><rect x="80" y="152" width="324" height="54" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="96" y="175" font-size="16" fill="#241F1A" font-weight="800">2. 通知とミュートを整える</text><text x="96" y="196" font-size="13" fill="#4A423A">見逃さない・見すぎない</text><circle cx="44" cy="242" r="22" fill="#f97316"/><g transform="translate(32,230)"><rect x="2" y="4" width="20" height="18" rx="3" fill="#fff"/><rect x="2" y="4" width="20" height="5" rx="2" fill="#fff"/><rect x="4.5" y="11" width="15" height="8.5" rx="1" fill="#f97316"/><rect x="6" y="1" width="2.5" height="6" rx="1" fill="#fff"/><rect x="15.5" y="1" width="2.5" height="6" rx="1" fill="#fff"/><rect x="6.5" y="13" width="3" height="2.5" fill="#fff"/><rect x="11" y="13" width="3" height="2.5" fill="#fff"/><rect x="6.5" y="16.5" width="3" height="2.5" fill="#fff"/></g><rect x="80" y="216" width="324" height="54" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="96" y="239" font-size="16" fill="#241F1A" font-weight="800">3. 予定をカレンダーに</text><text x="96" y="260" font-size="13" fill="#4A423A">発売日・放送・申込の締め切り</text><circle cx="44" cy="306" r="22" fill="#f97316"/><g transform="translate(32,294)"><path d="M1 6h22v4a2 2 0 0 0 0 4v4H1v-4a2 2 0 0 0 0-4z" fill="#fff"/><line x1="16" y1="7" x2="16" y2="17" stroke="#f97316" stroke-width="1.6" stroke-dasharray="2 2"/></g><rect x="80" y="280" width="324" height="54" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="96" y="303" font-size="16" fill="#241F1A" font-weight="800">4. チケットの決まりを知る</text><text x="96" y="324" font-size="13" fill="#4A423A">買うのは公式・正規のルート</text><circle cx="44" cy="370" r="22" fill="#f97316"/><g transform="translate(32,358)"><path d="M3 4h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H10l-5 4v-4H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fff"/><circle cx="7.5" cy="11" r="1.5" fill="#f97316"/><circle cx="12" cy="11" r="1.5" fill="#f97316"/><circle cx="16.5" cy="11" r="1.5" fill="#f97316"/></g><rect x="80" y="344" width="324" height="54" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="96" y="367" font-size="16" fill="#241F1A" font-weight="800">5. SNSのマナーを知る</text><text x="96" y="388" font-size="13" fill="#4A423A">動画・画像は公式のルールで</text><circle cx="44" cy="434" r="22" fill="#f97316"/><g transform="translate(32,422)"><circle cx="12" cy="12" r="10" fill="#fff"/><path d="M8 6l4 5.5L16 6M12 11.5V18M8.5 12.5h7M8.5 15h7" fill="none" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/></g><rect x="80" y="408" width="324" height="54" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="96" y="431" font-size="16" fill="#241F1A" font-weight="800">6. 予算を決める</text><text x="96" y="452" font-size="13" fill="#4A423A">生活費を先に、残りで楽しむ</text><circle cx="44" cy="498" r="22" fill="#f97316"/><g transform="translate(32,486)"><path d="M12 23s-8-8.2-8-13.5a8 8 0 0 1 16 0C20 14.8 12 23 12 23z" fill="#fff"/><circle cx="12" cy="9.5" r="3.2" fill="#f97316"/></g><rect x="80" y="472" width="324" height="54" rx="12" fill="#FEEDE1" stroke="#f97316" stroke-width="1"/><text x="96" y="495" font-size="16" fill="#241F1A" font-weight="800">7. 推しの足あとをたどる</text><text x="96" y="516" font-size="13" fill="#C2410C">行ったお店を地図で探す</text></svg>
