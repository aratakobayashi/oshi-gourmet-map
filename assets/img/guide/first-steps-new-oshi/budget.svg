<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 518" width="420" height="518" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="518" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">推し活の予算の決め方</text>
<text x="20" y="64" font-size="12" fill="#6B6258">無理なく長く楽しむための考え方</text>
<rect x="16" y="84" width="388" height="150" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="32" y="112" font-size="15" fill="#241F1A" font-weight="800">毎月のお金を3つに分ける</text><rect x="32" y="128" width="196.36" height="44" rx="8" fill="#9C9187"/><text x="130.18" y="156" font-size="15" fill="#fff" font-weight="800" text-anchor="middle">生活費</text><rect x="231.36" y="128" width="61.08" height="44" rx="8" fill="#D6CCBE"/><text x="261.90000000000003" y="156" font-size="15" fill="#241F1A" font-weight="800" text-anchor="middle">貯金</text><rect x="295.44" y="128" width="89.56" height="44" rx="8" fill="#f97316"/><text x="340.22" y="156" font-size="15" fill="#fff" font-weight="800" text-anchor="middle">推し活</text><text x="32" y="196" font-size="14" fill="#4A423A">先に生活費と貯金を分けて、残りを</text><text x="32" y="218" font-size="14" fill="#4A423A">推し活の予算にする（割合は人それぞれ）</text><rect x="16" y="248" width="388" height="176" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="32" y="276" font-size="15" fill="#241F1A" font-weight="800">予算の中で、使い道に順番をつける</text><rect x="32" y="294" width="356" height="34" rx="8" fill="#FDD1B2"/><text x="50" y="317" font-size="16" fill="#C2410C" font-weight="800" text-anchor="middle">1</text><g transform="translate(68,299)"><path d="M2 3h20v4c-3 0-3 3-5 3s-2-3-5-3-3 3-5 3-2-3-5-3z" fill="#C2410C"/><rect x="2" y="17" width="20" height="5" rx="1" fill="#C2410C"/><circle cx="12" cy="13" r="2.4" fill="#C2410C"/></g><text x="102" y="317" font-size="15" fill="#241F1A" font-weight="700">いちばん行きたい現場</text><rect x="32" y="336" width="356" height="34" rx="8" fill="#FEDFC9"/><text x="50" y="359" font-size="16" fill="#C2410C" font-weight="800" text-anchor="middle">2</text><g transform="translate(68,341)"><path d="M8 8V6a4 4 0 0 1 8 0v2" fill="none" stroke="#C2410C" stroke-width="2.2"/><path d="M4 8h16l-1.5 14h-13z" fill="#C2410C"/></g><text x="102" y="359" font-size="15" fill="#241F1A" font-weight="700">本当に欲しいグッズ</text><rect x="32" y="378" width="356" height="34" rx="8" fill="#FEEDE1"/><text x="50" y="401" font-size="16" fill="#C2410C" font-weight="800" text-anchor="middle">3</text><g transform="translate(68,383)"><rect x="1" y="4" width="22" height="16" rx="4" fill="#C2410C"/><path d="M10 8.5v7l6-3.5z" fill="#fff"/></g><text x="102" y="401" font-size="15" fill="#241F1A" font-weight="700">作品・配信・その他</text><rect x="16" y="438" width="388" height="62" rx="12" fill="#241F1A"/><text x="32" y="464" font-size="13" fill="#fff">困ったときは</text><text x="32" y="486" font-size="18" fill="#fff" font-weight="800">消費者ホットライン 188</text><text x="388" y="486" font-size="13" fill="#fff" text-anchor="end">（いやや！）</text></svg>
