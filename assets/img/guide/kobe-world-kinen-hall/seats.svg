<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 586" width="600" height="586" role="img" aria-label="ワールド記念ホールの座席のつくり" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>ワールド記念ホールの座席のつくり</title><rect width="600" height="586" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="28" fill="#241F1A" font-weight="700" text-anchor="start">座席のつくり（断面のイメージ）</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">アリーナ席は公演ごとに設営します</text><rect x="20" y="118" width="560" height="300" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><path d="M40 400 L40 220 Q300 140 560 220 L560 400 Z" fill="#EEF2F7"/><path d="M40 220 Q300 140 560 220" fill="none" stroke="#9AA8BA" stroke-width="4"/><path d="M48 250 L180 300 L180 360 L48 370 Z" fill="#7A4FB5"/><path d="M552 250 L420 300 L420 360 L552 370 Z" fill="#7A4FB5"/><rect x="200" y="384" width="200" height="16" fill="#2E8B57"/><rect x="250" y="350" width="100" height="34" rx="4" fill="#3B3346"/><text x="300" y="373" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">ステージの例</text><rect x="30" y="438" width="28" height="28" rx="7" fill="#7A4FB5"/><text x="72" y="460" font-size="22" fill="#241F1A" font-weight="700" text-anchor="start">スタンド席</text><text x="72" y="486" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">A〜Oブロックの固定席</text><rect x="30" y="500" width="28" height="28" rx="7" fill="#2E8B57"/><text x="72" y="522" font-size="22" fill="#241F1A" font-weight="700" text-anchor="start">アリーナ席（1階席）</text><text x="72" y="548" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">ステージと同じフロア。公演ごと</text></svg>