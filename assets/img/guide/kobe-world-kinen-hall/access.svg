<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 534" width="600" height="534" role="img" aria-label="ワールド記念ホールと最寄り駅の位置関係" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>ワールド記念ホールと最寄り駅の位置関係</title><rect width="600" height="534" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="30" fill="#241F1A" font-weight="700" text-anchor="start">ワールド記念ホールと最寄り駅</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">北が上。位置関係のイメージです</text><path d="M560 30 L572 60 L560 53 L548 60 Z" fill="#241F1A"/><text x="560" y="80" font-size="16" fill="#241F1A" font-weight="700" text-anchor="middle">N</text><path d="M470 98 L530 98" stroke="#241F1A" stroke-width="3"/><text x="500.0" y="90" font-size="15" fill="#6B6258" font-weight="400" text-anchor="middle">100m</text><rect x="20" y="118" width="560" height="320" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><ellipse cx="244" cy="326" rx="42" ry="38" fill="#EEF2F7" stroke="#9AA8BA" stroke-width="3"/><ellipse cx="244" cy="326" rx="29" ry="26" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><ellipse cx="244" cy="326" rx="16" ry="14" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><rect x="164" y="369" width="159" height="32" rx="16" fill="#fff" stroke="#9AA8BA"/><text x="243.9004799994973" y="391.31909999975085" font-size="15" fill="#241F1A" font-weight="700" text-anchor="middle">ワールド記念ホール</text><line x1="356" y1="230" x2="380" y2="230.48089999977594" stroke="#2F6FB5" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="380" y="198.48089999977594" width="190" height="64" rx="12" fill="#fff" stroke="#2F6FB5" stroke-width="2.5"/><text x="390" y="225.48089999977594" font-size="13" fill="#2F6FB5" font-weight="700" text-anchor="start">ポートライナー 市民広場駅</text><text x="390" y="250.48089999977594" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">西出口から徒歩約3分</text><circle cx="356" cy="230" r="11" fill="#2F6FB5" stroke="#fff" stroke-width="4"/><rect x="20" y="450" width="560" height="70" rx="12" fill="#FBE6DD"/><text x="36" y="476" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">市民広場駅は改札を出て左の西出口へ</text><text x="36" y="504" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">来場者用の駐車場はなし</text></svg>