<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 538" width="420" height="538" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="538" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">持ち歩くときの5つの注意</text>
<text x="20" y="64" font-size="12" fill="#6B6258">まわりの人にも、推しのグッズにもやさしく</text>
<rect x="16" y="86" width="388" height="78" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="56" cy="125.0" r="26" fill="#FAE8FF"/><rect x="41" y="108.0" width="30" height="30" rx="7" fill="#c026d3"/><rect x="46" y="113.0" width="20" height="10" rx="2" fill="#fff"/><circle cx="48" cy="131.0" r="2.5" fill="#fff"/><circle cx="64" cy="131.0" r="2.5" fill="#fff"/><path d="M45 145.0 l4 -6 M67 145.0 l-4 -6" stroke="#241F1A" stroke-width="2.5" stroke-linecap="round"/><text x="98" y="114" font-size="16" fill="#241F1A" font-weight="800">混んだ電車では</text><text x="98" y="136" font-size="14" fill="#6B6258">背負ったままにせず、</text><text x="98" y="154" font-size="14" fill="#6B6258">通路やドアをふさがない</text><rect x="16" y="174" width="388" height="78" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="56" cy="213.0" r="26" fill="#FAE8FF"/><path d="M38 225.0 v-12 q18 -18 36 0 v12z" fill="#c026d3"/><rect x="36" y="225.0" width="40" height="5" rx="2" fill="#241F1A"/><rect x="51" y="215.0" width="10" height="10" fill="#fff"/><text x="98" y="202" font-size="16" fill="#241F1A" font-weight="800">公演の会場では</text><text x="98" y="224" font-size="14" fill="#6B6258">持ち込めるか・置き場所は</text><text x="98" y="242" font-size="14" fill="#6B6258">主催者と会場の案内で確認</text><rect x="16" y="262" width="388" height="78" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="56" cy="301.0" r="26" fill="#FAE8FF"/><rect x="43" y="287.0" width="26" height="30" rx="5" fill="#c026d3"/><path d="M51 287.0 v-5 h10 v5" fill="none" stroke="#241F1A" stroke-width="2.5"/><circle cx="49" cy="320.0" r="2.5" fill="#241F1A"/><circle cx="63" cy="320.0" r="2.5" fill="#241F1A"/><text x="98" y="290" font-size="16" fill="#241F1A" font-weight="800">大きな荷物は</text><text x="98" y="312" font-size="14" fill="#6B6258">会場に着く前に</text><text x="98" y="330" font-size="14" fill="#6B6258">駅やホテルに預ける</text><rect x="16" y="350" width="388" height="78" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="56" cy="389.0" r="26" fill="#FAE8FF"/><path d="M40 401.0 L70 377.0 a5 5 0 0 1 4 8 L46 405.0 a4 4 0 0 1 -6 -4z" fill="none" stroke="#241F1A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="43" cy="403.0" r="4" fill="#c026d3"/><text x="98" y="378" font-size="16" fill="#241F1A" font-weight="800">とがった部分に注意</text><text x="98" y="400" font-size="14" fill="#6B6258">ピンの先は外に出さない。</text><text x="98" y="418" font-size="14" fill="#6B6258">人やグッズを傷つけない</text><rect x="16" y="438" width="388" height="78" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="56" cy="477.0" r="26" fill="#FAE8FF"/><circle cx="56" cy="477.0" r="16" fill="#c026d3"/><path d="M49 477.0 l5 5 9 -10" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="466" font-size="16" fill="#241F1A" font-weight="800">出かける前に</text><text x="98" y="488" font-size="14" fill="#6B6258">揺らして、グッズが</text><text x="98" y="506" font-size="14" fill="#6B6258">外れないか確かめる</text></svg>
