<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 596" width="420" height="596" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="596" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">作り方の6ステップ</text>
<text x="20" y="64" font-size="12" fill="#6B6258">留めるのは最後。先に並べて決めると失敗しにくい</text>
<rect x="16" y="86" width="388" height="66" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="119.0" r="22" fill="#c026d3"/><text x="52" y="126.0" font-size="20" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="90" y="115" font-size="16" fill="#241F1A" font-weight="800">テーマを決める</text><text x="90" y="136" font-size="14" fill="#6B6258">主役・色・使う場面を決める</text><path d="M52 154 v14" stroke="#c026d3" stroke-width="3"/><path d="M46 162 l6 6 6 -6" fill="none" stroke="#c026d3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="170" width="388" height="66" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="203.0" r="22" fill="#c026d3"/><text x="52" y="210.0" font-size="20" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="90" y="199" font-size="16" fill="#241F1A" font-weight="800">窓の大きさを測る</text><text x="90" y="220" font-size="14" fill="#6B6258">内側の幅・高さ・奥行き</text><path d="M52 238 v14" stroke="#c026d3" stroke-width="3"/><path d="M46 246 l6 6 6 -6" fill="none" stroke="#c026d3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="254" width="388" height="66" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="287.0" r="22" fill="#c026d3"/><text x="52" y="294.0" font-size="20" fill="#fff" font-weight="800" text-anchor="middle">3</text><text x="90" y="283" font-size="16" fill="#241F1A" font-weight="800">中敷きを作る</text><text x="90" y="304" font-size="14" fill="#6B6258">板を切って、布で包む</text><path d="M52 322 v14" stroke="#c026d3" stroke-width="3"/><path d="M46 330 l6 6 6 -6" fill="none" stroke="#c026d3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="338" width="388" height="66" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="371.0" r="22" fill="#86198f"/><text x="52" y="378.0" font-size="20" fill="#fff" font-weight="800" text-anchor="middle">4</text><text x="90" y="367" font-size="16" fill="#241F1A" font-weight="800">並べて試す</text><text x="90" y="388" font-size="14" fill="#6B6258">留める前に置いて写真に残す</text><path d="M52 406 v14" stroke="#c026d3" stroke-width="3"/><path d="M46 414 l6 6 6 -6" fill="none" stroke="#c026d3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="422" width="388" height="66" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="455.0" r="22" fill="#c026d3"/><text x="52" y="462.0" font-size="20" fill="#fff" font-weight="800" text-anchor="middle">5</text><text x="90" y="451" font-size="16" fill="#241F1A" font-weight="800">裏から留める</text><text x="90" y="472" font-size="14" fill="#6B6258">主役→まわり→飾りの順</text><path d="M52 490 v14" stroke="#c026d3" stroke-width="3"/><path d="M46 498 l6 6 6 -6" fill="none" stroke="#c026d3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="506" width="388" height="66" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="539.0" r="22" fill="#c026d3"/><text x="52" y="546.0" font-size="20" fill="#fff" font-weight="800" text-anchor="middle">6</text><text x="90" y="535" font-size="16" fill="#241F1A" font-weight="800">仕上げの確認</text><text x="90" y="556" font-size="14" fill="#6B6258">揺らしても動かないか・重さ</text><rect x="318" y="348" width="74" height="24" rx="12" fill="#FAE8FF"/><text x="355" y="365" font-size="13" fill="#86198f" font-weight="800" text-anchor="middle">大事</text></svg>
