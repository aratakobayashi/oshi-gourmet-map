<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" width="420" height="640" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="640" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">材料と道具</text>
<text x="20" y="64" font-size="12" fill="#6B6258">そろえるものは8種類（バッグの形で変わります）</text>
<rect x="16" y="86" width="188" height="112" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="126" r="27" fill="#FAE8FF"/><path d="M43 116 q0 -9 9 -9 q9 0 9 9" fill="none" stroke="#241F1A" stroke-width="3"/><rect x="34" y="116" width="36" height="30" rx="6" fill="#c026d3"/><rect x="40" y="122" width="24" height="18" rx="3" fill="#FAE8FF"/><text x="90" y="132" font-size="13" fill="#c026d3" font-weight="800">01</text><text x="30" y="170" font-size="15" fill="#241F1A" font-weight="800">窓つきのバッグ</text><text x="30" y="188" font-size="13" fill="#6B6258">トート・リュックなど</text><rect x="216" y="86" width="188" height="112" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="252" cy="126" r="27" fill="#FAE8FF"/><rect x="234" y="112" width="36" height="30" rx="3" fill="#fff" stroke="#241F1A" stroke-width="2.5"/><path d="M234 142 l6 4 h36 v-30 l-6 -4" fill="none" stroke="#241F1A" stroke-width="2"/><text x="290" y="132" font-size="13" fill="#c026d3" font-weight="800">02</text><text x="230" y="170" font-size="15" fill="#241F1A" font-weight="800">中敷きの板</text><text x="230" y="188" font-size="13" fill="#6B6258">窓の大きさに合わせる</text><rect x="16" y="210" width="188" height="112" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="250" r="27" fill="#FAE8FF"/><path d="M34 238 q9 -6 18 0 t18 0 v26 q-9 -6 -18 0 t-18 0z" fill="#c026d3"/><path d="M38 248 h28 M38 256 h28" stroke="#fff" stroke-width="2" stroke-dasharray="3 3"/><text x="90" y="256" font-size="13" fill="#c026d3" font-weight="800">03</text><text x="30" y="294" font-size="15" fill="#241F1A" font-weight="800">布・フェルト</text><text x="30" y="312" font-size="13" fill="#6B6258">推しの色で台を包む</text><rect x="216" y="210" width="188" height="112" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="252" cy="250" r="27" fill="#FAE8FF"/><circle cx="244" cy="244" r="11" fill="#c026d3"/><circle cx="244" cy="244" r="6.1" fill="#fff" opacity=".85"/><circle cx="262" cy="258" r="9" fill="#c026d3"/><circle cx="262" cy="258" r="5.0" fill="#fff" opacity=".85"/><rect x="234" y="256" width="14" height="14" rx="3" fill="#fff" stroke="#c026d3" stroke-width="2.5"/><text x="290" y="256" font-size="13" fill="#c026d3" font-weight="800">04</text><text x="230" y="294" font-size="15" fill="#241F1A" font-weight="800">飾るグッズ</text><text x="230" y="312" font-size="13" fill="#6B6258">缶バッジ・アクキーなど</text><rect x="16" y="334" width="188" height="112" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="374" r="27" fill="#FAE8FF"/><path d="M36 386 L66 362 a5 5 0 0 1 4 8 L42 390 a4 4 0 0 1 -6 -4z" fill="none" stroke="#241F1A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="39" cy="388" r="4" fill="#c026d3"/><text x="90" y="380" font-size="13" fill="#c026d3" font-weight="800">05</text><text x="30" y="418" font-size="15" fill="#241F1A" font-weight="800">留める道具</text><text x="30" y="436" font-size="13" fill="#6B6258">ピン・クリップ・テープ</text><rect x="216" y="334" width="188" height="112" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="252" cy="374" r="27" fill="#FAE8FF"/><path d="M252 374 l-16 -11 v22z M252 374 l16 -11 v22z" fill="#c026d3"/><circle cx="252" cy="374" r="5" fill="#86198f"/><text x="290" y="380" font-size="13" fill="#c026d3" font-weight="800">06</text><text x="230" y="418" font-size="15" fill="#241F1A" font-weight="800">飾り</text><text x="230" y="436" font-size="13" fill="#6B6258">リボン・レース</text><rect x="16" y="458" width="188" height="112" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="498" r="27" fill="#FAE8FF"/><rect x="38" y="480" width="28" height="36" rx="4" fill="#FAE8FF" stroke="#241F1A" stroke-width="2.5"/><rect x="44" y="488" width="16" height="20" rx="2" fill="#c026d3"/><path d="M38 486 h28" stroke="#241F1A" stroke-width="2"/><text x="90" y="504" font-size="13" fill="#c026d3" font-weight="800">07</text><text x="30" y="542" font-size="15" fill="#241F1A" font-weight="800">保護するもの</text><text x="30" y="560" font-size="13" fill="#6B6258">グッズ用の袋・カバー</text><rect x="216" y="458" width="188" height="112" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="252" cy="498" r="27" fill="#FAE8FF"/><circle cx="242" cy="508" r="6" fill="none" stroke="#241F1A" stroke-width="2.5"/><circle cx="254" cy="510" r="6" fill="none" stroke="#241F1A" stroke-width="2.5"/><path d="M245 503 L260 480 M251 505 L240 482" stroke="#241F1A" stroke-width="2.5" stroke-linecap="round"/><rect x="258" y="492" width="14" height="24" rx="2" fill="#c026d3"/><path d="M258 498 h5 M258 504 h5 M258 510 h5" stroke="#fff" stroke-width="1.5"/><text x="290" y="504" font-size="13" fill="#c026d3" font-weight="800">08</text><text x="230" y="542" font-size="15" fill="#241F1A" font-weight="800">はさみ・定規</text><text x="230" y="560" font-size="13" fill="#6B6258">測る・切る</text><rect x="20" y="582" width="380" height="40" rx="10" fill="#FAE8FF"/><text x="36" y="607" font-size="14" fill="#86198f" font-weight="700">先に窓の内側の大きさを測ってから買う</text></svg>
