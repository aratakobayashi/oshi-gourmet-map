<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 554" width="420" height="554" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="554" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">聖地めぐりの楽しみ方</text>
<text x="20" y="64" font-size="12" fill="#6B6258">推しが訪れたお店へ行く「グルメ聖地巡礼」の流れ</text>
<rect x="16" y="86" width="388" height="78" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><rect x="16" y="86" width="84" height="78" rx="12" fill="#e11d48"/><rect x="88" y="86" width="12" height="78" fill="#e11d48"/><g transform="translate(46,102)"><rect x="1" y="4" width="22" height="16" rx="4" fill="#fff"/><path d="M10 8.5v7l6-3.5z" fill="#e11d48"/></g><text x="58" y="150" font-size="15" fill="#fff" font-weight="800" text-anchor="middle">知る</text><text x="118" y="120" font-size="15" fill="#241F1A">動画や番組で、推しが</text><text x="118" y="144" font-size="15" fill="#241F1A" font-weight="700">行ったお店を知る</text><line x1="58" y1="166" x2="58" y2="178" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/><path d="M51 176l7 8 7-8z" fill="#e11d48"/><rect x="16" y="186" width="388" height="78" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><rect x="16" y="186" width="84" height="78" rx="12" fill="#e11d48"/><rect x="88" y="186" width="12" height="78" fill="#e11d48"/><g transform="translate(46,202)"><circle cx="10" cy="10" r="7" fill="none" stroke="#fff" stroke-width="3"/><line x1="15" y1="15" x2="21.5" y2="21.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></g><text x="58" y="250" font-size="15" fill="#fff" font-weight="800" text-anchor="middle">探す</text><text x="118" y="220" font-size="15" fill="#241F1A">このサイトの地図で</text><text x="118" y="244" font-size="15" fill="#241F1A" font-weight="700">場所と行き方を確かめる</text><line x1="58" y1="266" x2="58" y2="278" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/><path d="M51 276l7 8 7-8z" fill="#e11d48"/><rect x="16" y="286" width="388" height="78" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><rect x="16" y="286" width="84" height="78" rx="12" fill="#e11d48"/><rect x="88" y="286" width="12" height="78" fill="#e11d48"/><g transform="translate(46,302)"><path d="M2 11h20a10 9 0 0 1-20 0z" fill="#fff"/><rect x="7" y="20" width="10" height="2.5" rx="1" fill="#fff"/><path d="M9 8c0-2 2-2 2-4M14 8c0-2 2-2 2-4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g><text x="58" y="350" font-size="15" fill="#fff" font-weight="800" text-anchor="middle">訪れる</text><text x="118" y="320" font-size="15" fill="#241F1A">お店の決まりを守って</text><text x="118" y="344" font-size="15" fill="#241F1A" font-weight="700">同じメニューを味わう</text><line x1="58" y1="366" x2="58" y2="378" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/><path d="M51 376l7 8 7-8z" fill="#e11d48"/><rect x="16" y="386" width="388" height="78" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><rect x="16" y="386" width="84" height="78" rx="12" fill="#e11d48"/><rect x="88" y="386" width="12" height="78" fill="#e11d48"/><g transform="translate(46,402)"><rect x="4" y="2" width="16" height="20" rx="2" fill="#fff"/><line x1="7.5" y1="8" x2="16.5" y2="8" stroke="#e11d48" stroke-width="1.8"/><line x1="7.5" y1="12" x2="16.5" y2="12" stroke="#e11d48" stroke-width="1.8"/><line x1="7.5" y1="16" x2="13" y2="16" stroke="#e11d48" stroke-width="1.8"/></g><text x="58" y="450" font-size="15" fill="#fff" font-weight="800" text-anchor="middle">残す</text><text x="118" y="420" font-size="15" fill="#241F1A">食べたものや日付を</text><text x="118" y="444" font-size="15" fill="#241F1A" font-weight="700">記録して思い出に</text><rect x="16" y="478" width="388" height="58" rx="12" fill="#FBE4E9"/><text x="32" y="502" font-size="14" fill="#e11d48" font-weight="700">撮影・予約・混雑のときの決まりは</text><text x="32" y="523" font-size="14" fill="#e11d48" font-weight="700">お店ごとに違います。店の案内に従いましょう</text></svg>
