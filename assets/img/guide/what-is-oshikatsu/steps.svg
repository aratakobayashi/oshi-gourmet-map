<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 578" width="420" height="578" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="578" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">推し活をはじめる3ステップ</text>
<text x="20" y="64" font-size="12" fill="#6B6258">小さく始めて、少しずつ広げる</text>
<rect x="16" y="86" width="388" height="124" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><path d="M28 86h-0" /><circle cx="56" cy="148" r="28" fill="#e11d48"/><g transform="translate(44,136)"><path d="M12 2a6 6 0 0 1 6 6v5l2.5 4h-17L6 13V8a6 6 0 0 1 6-6z" fill="#fff"/><circle cx="12" cy="20" r="2.5" fill="#fff"/></g><text x="100" y="120" font-size="18" fill="#241F1A" font-weight="800">1. 公式をフォロー</text><rect x="100.0" y="132" width="112" height="22" rx="11" fill="#FBE4E9"/><text x="156" y="148" font-size="12" fill="#e11d48" font-weight="700" text-anchor="middle">まずはここから</text><circle cx="106" cy="174" r="3" fill="#e11d48"/><text x="116" y="178" font-size="14" fill="#241F1A">公式サイト・SNS・YouTube</text><circle cx="106" cy="196" r="3" fill="#e11d48"/><text x="116" y="200" font-size="14" fill="#241F1A">情報は公式で確かめる</text><line x1="56" y1="212" x2="56" y2="226" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/><path d="M49 224l7 8 7-8z" fill="#e11d48"/><rect x="16" y="234" width="388" height="124" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><path d="M28 234h-0" /><circle cx="56" cy="296" r="28" fill="#e11d48"/><g transform="translate(44,284)"><path d="M12 21s-9-5.6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.4-9 12-9 12z" fill="#fff"/></g><text x="100" y="268" font-size="18" fill="#241F1A" font-weight="800">2. 好きな形で楽しむ</text><rect x="100.0" y="280" width="112" height="22" rx="11" fill="#FBE4E9"/><text x="156" y="296" font-size="12" fill="#e11d48" font-weight="700" text-anchor="middle">自分のペースで</text><circle cx="106" cy="322" r="3" fill="#e11d48"/><text x="116" y="326" font-size="14" fill="#241F1A">見る・聴く・語るからでOK</text><circle cx="106" cy="344" r="3" fill="#e11d48"/><text x="116" y="348" font-size="14" fill="#241F1A">お金をかけなくても始められる</text><line x1="56" y1="360" x2="56" y2="374" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/><path d="M49 372l7 8 7-8z" fill="#e11d48"/><rect x="16" y="382" width="388" height="124" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><path d="M28 382h-0" /><circle cx="56" cy="444" r="28" fill="#e11d48"/><g transform="translate(44,432)"><path d="M12 23s-8-8.2-8-13.5a8 8 0 0 1 16 0C20 14.8 12 23 12 23z" fill="#fff"/><circle cx="12" cy="9.5" r="3.2" fill="#e11d48"/></g><text x="100" y="416" font-size="18" fill="#241F1A" font-weight="800">3. 気が向いたら外へ</text><rect x="100.0" y="428" width="112" height="22" rx="11" fill="#FBE4E9"/><text x="156" y="444" font-size="12" fill="#e11d48" font-weight="700" text-anchor="middle">楽しみが広がる</text><circle cx="106" cy="470" r="3" fill="#e11d48"/><text x="116" y="474" font-size="14" fill="#241F1A">ライブやイベントに行く</text><circle cx="106" cy="492" r="3" fill="#e11d48"/><text x="116" y="496" font-size="14" fill="#241F1A">推しが行ったお店をめぐる</text><rect x="16" y="520" width="388" height="40" rx="12" fill="#FBE4E9"/><text x="210" y="546" font-size="15" fill="#e11d48" font-weight="800" text-anchor="middle">がんばりすぎず、続けられる形で</text></svg>
