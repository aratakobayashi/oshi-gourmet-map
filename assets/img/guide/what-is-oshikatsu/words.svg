<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 446" width="420" height="446" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="446" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">知っておくと楽しい推し活のことば</text>
<text x="20" y="64" font-size="12" fill="#6B6258">SNSやイベントの案内でよく見かける言葉</text>
<rect x="16" y="86" width="388" height="50" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><rect x="26" y="97" width="92" height="28" rx="14" fill="#e11d48"/><text x="72" y="116" font-size="15" fill="#fff" font-weight="800" text-anchor="middle">推し</text><text x="132" y="117" font-size="14" fill="#241F1A">いちばん応援している人や作品</text><rect x="16" y="144" width="388" height="50" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><rect x="26" y="155" width="92" height="28" rx="14" fill="#e11d48"/><text x="72" y="174" font-size="15" fill="#fff" font-weight="800" text-anchor="middle">推し活</text><text x="132" y="175" font-size="14" fill="#241F1A">推しを応援する活動のぜんぶ</text><rect x="16" y="202" width="388" height="50" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><rect x="26" y="213" width="92" height="28" rx="14" fill="#e11d48"/><text x="72" y="232" font-size="15" fill="#fff" font-weight="800" text-anchor="middle">現場</text><text x="132" y="233" font-size="14" fill="#241F1A">ライブ・舞台など推しに会える場</text><rect x="16" y="260" width="388" height="50" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><rect x="26" y="271" width="92" height="28" rx="14" fill="#e11d48"/><text x="72" y="290" font-size="15" fill="#fff" font-weight="800" text-anchor="middle">同担</text><text x="132" y="291" font-size="14" fill="#241F1A">同じ推しを応援している人</text><rect x="16" y="318" width="388" height="50" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><rect x="26" y="329" width="92" height="28" rx="14" fill="#e11d48"/><text x="72" y="348" font-size="15" fill="#fff" font-weight="800" text-anchor="middle">〜担</text><text x="132" y="349" font-size="14" fill="#241F1A">誰を応援しているかを表す言葉</text><rect x="16" y="376" width="388" height="50" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><rect x="26" y="387" width="92" height="28" rx="14" fill="#e11d48"/><text x="72" y="406" font-size="15" fill="#fff" font-weight="800" text-anchor="middle">聖地巡礼</text><text x="132" y="407" font-size="14" fill="#241F1A">作品や推しにゆかりの場所をめぐる</text></svg>
