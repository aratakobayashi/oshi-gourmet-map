<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" width="420" height="580" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="580" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">推し活の楽しみ方マップ</text>
<text x="20" y="64" font-size="12" fill="#6B6258">どれから始めてもOK。組み合わせも自由です</text>
<rect x="16" y="84" width="190" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="46" cy="114" r="18" fill="#e11d48"/><g transform="translate(34,102)"><rect x="1" y="4" width="22" height="16" rx="4" fill="#fff"/><path d="M10 8.5v7l6-3.5z" fill="#e11d48"/></g><text x="72" y="120" font-size="16" fill="#241F1A" font-weight="800">見る・聴く</text><text x="32" y="152" font-size="13" fill="#4A423A">出演番組や配信、</text><text x="32" y="170" font-size="13" fill="#4A423A">曲を楽しむ</text><rect x="214" y="84" width="190" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="244" cy="114" r="18" fill="#e11d48"/><g transform="translate(232,102)"><path d="M12 2a6 6 0 0 1 6 6v5l2.5 4h-17L6 13V8a6 6 0 0 1 6-6z" fill="#fff"/><circle cx="12" cy="20" r="2.5" fill="#fff"/></g><text x="270" y="120" font-size="16" fill="#241F1A" font-weight="800">情報を追う</text><text x="230" y="152" font-size="13" fill="#4A423A">公式のお知らせを</text><text x="230" y="170" font-size="13" fill="#4A423A">チェックする</text><rect x="16" y="192" width="190" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="46" cy="222" r="18" fill="#e11d48"/><g transform="translate(34,210)"><path d="M2 3h20v4c-3 0-3 3-5 3s-2-3-5-3-3 3-5 3-2-3-5-3z" fill="#fff"/><rect x="2" y="17" width="20" height="5" rx="1" fill="#fff"/><circle cx="12" cy="13" r="2.4" fill="#fff"/></g><text x="72" y="228" font-size="16" fill="#241F1A" font-weight="800">現場へ行く</text><text x="32" y="260" font-size="13" fill="#4A423A">ライブや舞台、</text><text x="32" y="278" font-size="13" fill="#4A423A">イベントに行く</text><rect x="214" y="192" width="190" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="244" cy="222" r="18" fill="#e11d48"/><g transform="translate(232,210)"><path d="M8 8V6a4 4 0 0 1 8 0v2" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M4 8h16l-1.5 14h-13z" fill="#fff"/></g><text x="270" y="228" font-size="16" fill="#241F1A" font-weight="800">グッズを集める</text><text x="230" y="260" font-size="13" fill="#4A423A">公式グッズを</text><text x="230" y="278" font-size="13" fill="#4A423A">選んで楽しむ</text><rect x="16" y="300" width="190" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="46" cy="330" r="18" fill="#e11d48"/><g transform="translate(34,318)"><path d="M3 4h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H10l-5 4v-4H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fff"/><circle cx="7.5" cy="11" r="1.5" fill="#e11d48"/><circle cx="12" cy="11" r="1.5" fill="#e11d48"/><circle cx="16.5" cy="11" r="1.5" fill="#e11d48"/></g><text x="72" y="336" font-size="16" fill="#241F1A" font-weight="800">語る・発信する</text><text x="32" y="368" font-size="13" fill="#4A423A">感想をSNSや</text><text x="32" y="386" font-size="13" fill="#4A423A">友だちと分かち合う</text><rect x="214" y="300" width="190" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="244" cy="330" r="18" fill="#e11d48"/><g transform="translate(232,318)"><rect x="4" y="2" width="16" height="20" rx="2" fill="#fff"/><line x1="7.5" y1="8" x2="16.5" y2="8" stroke="#e11d48" stroke-width="1.8"/><line x1="7.5" y1="12" x2="16.5" y2="12" stroke="#e11d48" stroke-width="1.8"/><line x1="7.5" y1="16" x2="13" y2="16" stroke="#e11d48" stroke-width="1.8"/></g><text x="270" y="336" font-size="16" fill="#241F1A" font-weight="800">記録する</text><text x="230" y="368" font-size="13" fill="#4A423A">見た作品や</text><text x="230" y="386" font-size="13" fill="#4A423A">行った場所を残す</text><rect x="16" y="408" width="190" height="98" rx="12" fill="#FBE4E9" stroke="#e11d48" stroke-width="1"/><circle cx="46" cy="438" r="18" fill="#e11d48"/><g transform="translate(34,426)"><path d="M12 23s-8-8.2-8-13.5a8 8 0 0 1 16 0C20 14.8 12 23 12 23z" fill="#fff"/><circle cx="12" cy="9.5" r="3.2" fill="#e11d48"/></g><text x="72" y="444" font-size="16" fill="#241F1A" font-weight="800">聖地をめぐる</text><text x="32" y="476" font-size="13" fill="#4A423A">推しが訪れた</text><text x="32" y="494" font-size="13" fill="#4A423A">場所へ行ってみる</text><rect x="214" y="408" width="190" height="98" rx="12" fill="#FBE4E9" stroke="#e11d48" stroke-width="1"/><circle cx="244" cy="438" r="18" fill="#e11d48"/><g transform="translate(232,426)"><path d="M2 11h20a10 9 0 0 1-20 0z" fill="#fff"/><rect x="7" y="20" width="10" height="2.5" rx="1" fill="#fff"/><path d="M9 8c0-2 2-2 2-4M14 8c0-2 2-2 2-4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g><text x="270" y="444" font-size="16" fill="#241F1A" font-weight="800">推しの味を知る</text><text x="230" y="476" font-size="13" fill="#4A423A">推しが食べた</text><text x="230" y="494" font-size="13" fill="#4A423A">お店で味わう</text><rect x="16" y="520" width="388" height="40" rx="12" fill="#e11d48"/><circle cx="40" cy="540" r="12" fill="#fff"/><g transform="translate(28,528)"><path d="M12 23s-8-8.2-8-13.5a8 8 0 0 1 16 0C20 14.8 12 23 12 23z" fill="#e11d48"/><circle cx="12" cy="9.5" r="3.2" fill="#fff"/></g><text x="60" y="546" font-size="14" fill="#fff" font-weight="700">聖地めぐりと推しの味は、このサイトの地図で</text></svg>
