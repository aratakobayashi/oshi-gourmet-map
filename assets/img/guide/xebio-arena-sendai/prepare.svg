<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740" role="img" aria-label="ゼビオアリーナ仙台に行く日の準備" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>ゼビオアリーナ仙台に行く日の準備</title><rect width="600" height="740" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="30" fill="#241F1A" font-weight="700" text-anchor="start">当日の準備 4つ</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">ゼビオアリーナ仙台公式サイトの案内より</text><rect x="20" y="118" width="560" height="140" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="20" y="118" width="8" height="140" rx="4" fill="#C2532F"/><g transform="translate(90,190) scale(.9)"><path d="M-40 10 L-30 -16 L30 -16 L40 10 L40 26 L-40 26 Z" fill="#E8EDF2" stroke="#6B6258" stroke-width="3"/><circle cx="-22" cy="28" r="8" fill="#6B6258"/><circle cx="22" cy="28" r="8" fill="#6B6258"/></g><text x="150" y="164" font-size="24" fill="#C2532F" font-weight="700" text-anchor="start">駐車場はない</text><text x="150" y="204" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">電車・地下鉄・バスなど</text><text x="150" y="234" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">公共交通機関で来場</text><rect x="20" y="272" width="560" height="140" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="20" y="272" width="8" height="140" rx="4" fill="#2F6FB5"/><g transform="translate(90,344) scale(.9)"><rect x="-30" y="-38" width="60" height="64" rx="12" fill="#DCEBFA" stroke="#2F6FB5" stroke-width="3"/><rect x="-22" y="-28" width="44" height="22" rx="4" fill="#fff" stroke="#2F6FB5" stroke-width="2"/><circle cx="-14" cy="12" r="5" fill="#2F6FB5"/><circle cx="14" cy="12" r="5" fill="#2F6FB5"/><path d="M-20 26 L-30 42 M20 26 L30 42" stroke="#2F6FB5" stroke-width="4"/></g><text x="150" y="318" font-size="24" fill="#2F6FB5" font-weight="700" text-anchor="start">JRの快速は止まらない</text><text x="150" y="358" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">仙台空港行・原ノ町行などで</text><text x="150" y="388" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">仙台駅から長町駅まで約5分</text><rect x="20" y="426" width="560" height="140" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="20" y="426" width="8" height="140" rx="4" fill="#2E8B57"/><g transform="translate(90,498) scale(.9)"><circle cx="0" cy="0" r="36" fill="#D8F0E2" stroke="#2E8B57" stroke-width="3"/><circle cx="0" cy="-16" r="5" fill="#2E8B57"/><rect x="-5" y="-6" width="10" height="28" rx="3" fill="#2E8B57"/></g><text x="150" y="472" font-size="24" fill="#2E8B57" font-weight="700" text-anchor="start">エレベーターは南2出口</text><text x="150" y="512" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">地下鉄長町駅の南2番出口から</text><text x="150" y="542" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">徒歩約6分</text><rect x="20" y="580" width="560" height="140" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="20" y="580" width="8" height="140" rx="4" fill="#7A4FB5"/><g transform="translate(90,652) scale(.9)"><path d="M-40 6 L40 -6 L46 0 L40 6 L-40 -6 Z M-6 0 L-22 -32 L-10 -32 L14 0 L-10 32 L-22 32 Z" fill="#DCEBFA" stroke="#2F6FB5" stroke-width="3"/></g><text x="150" y="626" font-size="24" fill="#7A4FB5" font-weight="700" text-anchor="start">仙台空港から約20分</text><text x="150" y="666" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">空港アクセス線・東北本線</text><text x="150" y="696" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">直通で長町駅へ</text></svg>