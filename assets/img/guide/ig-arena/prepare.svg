<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740" role="img" aria-label="IGアリーナに行く日の準備" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>IGアリーナに行く日の準備</title><rect width="600" height="740" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="30" fill="#241F1A" font-weight="700" text-anchor="start">当日の準備 4つ</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">IGアリーナ公式サイト（よくあるご質問）より</text><rect x="20" y="118" width="560" height="140" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="20" y="118" width="8" height="140" rx="4" fill="#C2532F"/><g transform="translate(90,190) scale(.9)"><rect x="-40" y="-26" width="80" height="52" rx="8" fill="#FBE6DD" stroke="#C2532F" stroke-width="3"/><rect x="-40" y="-14" width="80" height="10" fill="#C2532F"/><rect x="-30" y="8" width="24" height="8" rx="2" fill="#C2532F"/></g><text x="150" y="164" font-size="24" fill="#C2532F" font-weight="700" text-anchor="start">完全キャッシュレス</text><text x="150" y="204" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">現金は使えない</text><text x="150" y="234" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">カード・電子マネー・QR</text><rect x="20" y="272" width="560" height="140" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="20" y="272" width="8" height="140" rx="4" fill="#2F6FB5"/><g transform="translate(90,344) scale(.9)"><rect x="-36" y="-36" width="72" height="72" rx="8" fill="#DCEBFA" stroke="#2F6FB5" stroke-width="3"/><line x1="0" y1="-36" x2="0" y2="36" stroke="#2F6FB5" stroke-width="3"/><line x1="-36" y1="0" x2="36" y2="0" stroke="#2F6FB5" stroke-width="3"/><circle cx="-8" cy="-18" r="3" fill="#2F6FB5"/><circle cx="28" cy="-18" r="3" fill="#2F6FB5"/></g><text x="150" y="318" font-size="24" fill="#2F6FB5" font-weight="700" text-anchor="start">ロッカーは交通系ICで</text><text x="150" y="358" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">場外3か所・場内3か所</text><text x="150" y="388" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">イベントの日だけ使える</text><rect x="20" y="426" width="560" height="140" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="20" y="426" width="8" height="140" rx="4" fill="#2E8B57"/><g transform="translate(90,498) scale(.9)"><rect x="-30" y="-30" width="60" height="70" rx="10" fill="#D8F0E2" stroke="#2E8B57" stroke-width="3"/><path d="M-12 -30 L-12 -44 L12 -44 L12 -30" fill="none" stroke="#2E8B57" stroke-width="4"/><circle cx="-18" cy="44" r="5" fill="#2E8B57"/><circle cx="18" cy="44" r="5" fill="#2E8B57"/></g><text x="150" y="472" font-size="24" fill="#2E8B57" font-weight="700" text-anchor="start">荷物は足元に入る大きさ</text><text x="150" y="512" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">キャリーケースなど</text><text x="150" y="542" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">キャスター付きはNG</text><rect x="20" y="580" width="560" height="140" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="20" y="580" width="8" height="140" rx="4" fill="#7A4FB5"/><g transform="translate(90,652) scale(.9)"><path d="M-40 10 L-30 -16 L30 -16 L40 10 L40 26 L-40 26 Z" fill="#E8EDF2" stroke="#6B6258" stroke-width="3"/><circle cx="-22" cy="28" r="8" fill="#6B6258"/><circle cx="22" cy="28" r="8" fill="#6B6258"/></g><text x="150" y="626" font-size="24" fill="#7A4FB5" font-weight="700" text-anchor="start">駐車場はない</text><text x="150" y="666" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">タクシー乗降所も常設なし</text><text x="150" y="696" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">公共交通機関で</text></svg>