<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 546" width="600" height="546" role="img" aria-label="IGアリーナと最寄り駅の位置関係" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>IGアリーナと最寄り駅の位置関係</title><rect width="600" height="546" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="30" fill="#241F1A" font-weight="700" text-anchor="start">IGアリーナと最寄り駅</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">北が上。位置関係のイメージです</text><path d="M560 30 L572 60 L560 53 L548 60 Z" fill="#241F1A"/><text x="560" y="80" font-size="16" fill="#241F1A" font-weight="700" text-anchor="middle">N</text><path d="M469 98 L530 98" stroke="#241F1A" stroke-width="3"/><text x="499.4345389709751" y="90" font-size="15" fill="#6B6258" font-weight="400" text-anchor="middle">500m</text><rect x="20" y="118" width="560" height="332" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><ellipse cx="328" cy="270" rx="26" ry="23" fill="#EEF2F7" stroke="#9AA8BA" stroke-width="3"/><ellipse cx="328" cy="270" rx="18" ry="16" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><ellipse cx="328" cy="270" rx="10" ry="9" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><rect x="270" y="299" width="117" height="32" rx="16" fill="#fff" stroke="#9AA8BA"/><text x="328.24615384597826" y="320.96209882824087" font-size="18" fill="#241F1A" font-weight="700" text-anchor="middle">IGアリーナ</text><line x1="228" y1="188" x2="220" y2="188.0" stroke="#D9822B" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="30" y="156.0" width="190" height="64" rx="12" fill="#fff" stroke="#D9822B" stroke-width="2.5"/><text x="40" y="183.0" font-size="17" fill="#D9822B" font-weight="700" text-anchor="start">地下鉄鶴舞線 浄心駅</text><text x="40" y="208.0" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">徒歩約18分</text><circle cx="228" cy="188" r="11" fill="#D9822B" stroke="#fff" stroke-width="4"/><line x1="354" y1="291" x2="380" y2="291.14009169629406" stroke="#2F6FB5" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="380" y="259.14009169629406" width="190" height="64" rx="12" fill="#fff" stroke="#2F6FB5" stroke-width="2.5"/><text x="390" y="286.14009169629406" font-size="14" fill="#2F6FB5" font-weight="700" text-anchor="start">地下鉄名城線 名城公園駅</text><text x="390" y="311.14009169629406" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">出てすぐ</text><line x1="372" y1="381" x2="380" y2="380.70911869582915" stroke="#2E8B57" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="380" y="348.70911869582915" width="190" height="64" rx="12" fill="#fff" stroke="#2E8B57" stroke-width="2.5"/><text x="390" y="375.70911869582915" font-size="14" fill="#2E8B57" font-weight="700" text-anchor="start">地下鉄名城線 名古屋城駅</text><text x="390" y="400.70911869582915" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">徒歩10分</text><circle cx="354" cy="291" r="11" fill="#2F6FB5" stroke="#fff" stroke-width="4"/><circle cx="372" cy="381" r="11" fill="#2E8B57" stroke="#fff" stroke-width="4"/><rect x="20" y="462" width="560" height="70" rx="12" fill="#FBE6DD"/><text x="36" y="488" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">名古屋駅から名城公園駅まで約15分</text><text x="36" y="516" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">駐車場なし。終演後はほかの駅の案内も</text></svg>