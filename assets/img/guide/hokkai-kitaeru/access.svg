<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" role="img" aria-label="北海きたえーると最寄り駅の位置関係" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>北海きたえーると最寄り駅の位置関係</title><rect width="600" height="700" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="30" fill="#241F1A" font-weight="700" text-anchor="start">北海きたえーると最寄り駅</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">北が上。位置関係のイメージです</text><path d="M560 30 L572 60 L560 53 L548 60 Z" fill="#241F1A"/><text x="560" y="80" font-size="16" fill="#241F1A" font-weight="700" text-anchor="middle">N</text><path d="M470 98 L530 98" stroke="#241F1A" stroke-width="3"/><text x="500.0" y="90" font-size="15" fill="#6B6258" font-weight="400" text-anchor="middle">100m</text><rect x="20" y="118" width="560" height="486" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><ellipse cx="263" cy="413" rx="42" ry="38" fill="#EEF2F7" stroke="#9AA8BA" stroke-width="3"/><ellipse cx="263" cy="413" rx="29" ry="26" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><ellipse cx="263" cy="413" rx="16" ry="14" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><rect x="188" y="457" width="150" height="32" rx="16" fill="#fff" stroke="#9AA8BA"/><text x="263.3070000014857" y="478.9079999999959" font-size="18" fill="#241F1A" font-weight="700" text-anchor="middle">北海きたえーる</text><line x1="246" y1="535" x2="220" y2="534.9860000003507" stroke="#2F6FB5" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="30" y="502.9860000003507" width="190" height="64" rx="12" fill="#fff" stroke="#2F6FB5" stroke-width="2.5"/><text x="40" y="529.9860000003507" font-size="14" fill="#2F6FB5" font-weight="700" text-anchor="start">地下鉄東豊線 豊平公園駅</text><text x="40" y="554.9860000003507" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">地下連絡通路で約5分</text><circle cx="246" cy="535" r="11" fill="#2F6FB5" stroke="#fff" stroke-width="4"/><line x1="354" y1="188" x2="380" y2="188.0" stroke="#2E8B57" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="380" y="156.0" width="190" height="64" rx="12" fill="#fff" stroke="#2E8B57" stroke-width="2.5"/><text x="390" y="183.0" font-size="16" fill="#2E8B57" font-weight="700" text-anchor="start">バス停 豊平三条十丁目</text><text x="390" y="208.0" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">徒歩約5分</text><circle cx="354" cy="188" r="11" fill="#2E8B57" stroke="#fff" stroke-width="4"/><rect x="20" y="616" width="560" height="70" rx="12" fill="#FBE6DD"/><text x="36" y="642" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">観覧・観戦の人は駐車場を使えない</text><text x="36" y="670" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">バスや地下鉄で来るよう案内あり</text></svg>