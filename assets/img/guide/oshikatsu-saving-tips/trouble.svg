<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 670" width="420" height="670" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="670" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">気をつけたいお金のトラブル</text>
<text x="20" y="64" font-size="12" fill="#6B6258">推し活で相談が寄せられている例</text>
<rect x="16" y="88" width="388" height="100" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="138" r="22" fill="#B45309"/><g transform="translate(40,126)"><path d="M1 5h22v5a2.5 2.5 0 0 0 0 5v5H1v-5a2.5 2.5 0 0 0 0-5z" fill="#fff"/><path d="M16 7v11" stroke="#B45309" stroke-width="1.6" stroke-dasharray="2 2"/></g><text x="88" y="118" font-size="16" fill="#241F1A" font-weight="800">SNSでのチケット取引</text><text x="88" y="146" font-size="14" fill="#241F1A">先に送金したら連絡がとれない、</text><text x="88" y="168" font-size="14" fill="#241F1A">という相談が（2026年10月）</text><rect x="16" y="200" width="388" height="100" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="250" r="22" fill="#B45309"/><g transform="translate(40,238)"><path d="M12 1.5L23 21.5H1z" fill="#fff"/><path d="M12 8.5v6" stroke="#B45309" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="18" r="1.5" fill="#B45309"/></g><text x="88" y="230" font-size="16" fill="#241F1A" font-weight="800">チケット転売仲介サイト</text><text x="88" y="258" font-size="14" fill="#241F1A">転売禁止のチケットは入場</text><text x="88" y="280" font-size="14" fill="#241F1A">できないおそれも（公式で確認）</text><rect x="16" y="312" width="388" height="100" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="362" r="22" fill="#B45309"/><g transform="translate(40,350)"><rect x="1" y="3" width="22" height="16" rx="4" fill="#fff"/><path d="M10 7.5v7l6-3.5z" fill="#B45309"/><rect x="6" y="21" width="12" height="2" rx="1" fill="#fff"/></g><text x="88" y="342" font-size="16" fill="#241F1A" font-weight="800">配信の投げ銭・課金</text><text x="88" y="370" font-size="14" fill="#241F1A">気づかないうちに高額に。</text><text x="88" y="392" font-size="14" fill="#241F1A">勢いで払わず、決済を管理</text><rect x="16" y="428" width="388" height="118" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><path d="M16 440a12 12 0 0 1 12-12h364a12 12 0 0 1 12 12v24H16z" fill="#16a34a"/><text x="32" y="453" font-size="16" fill="#fff" font-weight="800">こうすれば安心</text><g transform="translate(360,434)"><path d="M12 1l9.5 3.5v6.5c0 6-4 10.5-9.5 12C6.5 21.5 2.5 17 2.5 11V4.5z" fill="#fff"/><path d="M7.5 12l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="34" cy="485.1" r="3" fill="#16a34a"/><text x="44" y="490" font-size="14" fill="#241F1A">チケットは主催者・公式など正規ルートで</text><circle cx="34" cy="511.1" r="3" fill="#16a34a"/><text x="44" y="516" font-size="14" fill="#241F1A">行けなくなったら公式のリセールで譲る</text><rect x="16" y="560" width="190" height="70" rx="12" fill="#DEF2E6" stroke="#DEF2E6" stroke-width="1"/><text x="32" y="592" font-size="24" fill="#15803D" font-weight="800">188</text><text x="32" y="616" font-size="13" fill="#241F1A" font-weight="700">消費者ホットライン</text><rect x="214" y="560" width="190" height="70" rx="12" fill="#DEF2E6" stroke="#DEF2E6" stroke-width="1"/><text x="230" y="592" font-size="24" fill="#15803D" font-weight="800">#9110</text><text x="230" y="616" font-size="13" fill="#241F1A" font-weight="700">警察相談専用電話</text><text x="20" y="654" font-size="12" fill="#6B6258">出典：国民生活センター、総務省「インターネットトラブル事例集」</text></svg>
