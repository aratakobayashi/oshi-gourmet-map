<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 610" width="420" height="610" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="610" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">お金を分ける順番</text>
<text x="20" y="64" font-size="12" fill="#6B6258">給料が入ったら、先に分けてから使う</text>
<text x="76.0" y="88" font-size="12" fill="#6B6258" font-weight="700" text-anchor="middle">収入（手取り）</text><rect x="30" y="96" width="92" height="70" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/><text x="76.0" y="136.0" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">貯蓄</text><rect x="30" y="166" width="92" height="210" fill="#96D6AE" stroke="#16a34a" stroke-width="1.5"/><text x="76.0" y="276.0" font-size="14" fill="#241F1A" font-weight="800" text-anchor="middle">生活費</text><rect x="30" y="376" width="92" height="120" fill="#C5E8D2" stroke="#16a34a" stroke-width="1.5"/><text x="76.0" y="441.0" font-size="14" fill="#241F1A" font-weight="800" text-anchor="middle">推し活</text><rect x="30" y="496" width="92" height="50" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><text x="76.0" y="526.0" font-size="14" fill="#15803D" font-weight="800" text-anchor="middle">予備</text><rect x="30" y="96" width="92" height="450" rx="6" fill="none" stroke="#16a34a" stroke-width="2.5"/><text x="76.0" y="568" font-size="12" fill="#6B6258" text-anchor="middle">分け方のイメージ</text><rect x="140" y="88" width="264" height="104" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="162" cy="114" r="14" fill="#16a34a"/><text x="162" y="119" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="184" y="119" font-size="16" fill="#241F1A" font-weight="800">先取りで貯める</text><text x="156" y="148" font-size="14" fill="#241F1A">給料が入ったら、まず</text><text x="156" y="170" font-size="14" fill="#241F1A">一定額を別にしておく</text><rect x="140" y="204" width="264" height="104" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="162" cy="230" r="14" fill="#16a34a"/><text x="162" y="235" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="184" y="235" font-size="16" fill="#241F1A" font-weight="800">生活費を確保</text><text x="156" y="264" font-size="14" fill="#241F1A">家賃・通信などの固定費と</text><text x="156" y="286" font-size="14" fill="#241F1A">食費・日用品を先に</text><rect x="140" y="320" width="264" height="104" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="162" cy="346" r="14" fill="#16a34a"/><text x="162" y="351" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">3</text><text x="184" y="351" font-size="16" fill="#241F1A" font-weight="800">推し活の予算</text><text x="156" y="380" font-size="14" fill="#241F1A">予定している推し活に</text><text x="156" y="402" font-size="14" fill="#241F1A">使う分を決める</text><rect x="140" y="436" width="264" height="104" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="162" cy="462" r="14" fill="#16a34a"/><text x="162" y="467" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">4</text><text x="184" y="467" font-size="16" fill="#241F1A" font-weight="800">予備をとっておく</text><text x="156" y="496" font-size="14" fill="#241F1A">追加公演や急な発表に</text><text x="156" y="518" font-size="14" fill="#241F1A">備えて、少し残しておく</text><text x="20" y="590" font-size="12" fill="#6B6258">出典：J-FLEC（金融経済教育推進機構）コラム「先取り貯蓄」</text></svg>
