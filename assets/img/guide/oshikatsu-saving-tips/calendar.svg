h="88" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="28" y="322" font-size="16" fill="#241F1A" font-weight="800">9月</text><text x="28" y="350" font-size="13" fill="#15803D" font-weight="700">グッズ</text><rect x="116" y="296" width="88" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="128" y="322" font-size="16" fill="#241F1A" font-weight="800">10月</text><text x="128" y="350" font-size="13" fill="#15803D" font-weight="700">イベント</text><rect x="216" y="296" width="88" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="228" y="322" font-size="16" fill="#241F1A" font-weight="800">11月</text><rect x="316" y="296" width="88" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="328" y="322" font-size="16" fill="#241F1A" font-weight="800">12月</text><text x="328" y="350" font-size="13" fill="#15803D" font-weight="700">年末の</text><text x="328" y="372" font-size="13" fill="#15803D" font-weight="700">番組・配信</text><rect x="20" y="406" width="18" height="18" rx="4" fill="#16a34a"/><text x="46" y="420" font-size="14" fill="#241F1A" font-weight="700">出費が重なる月 → 前の月から準備</text><text x="20" y="452" font-size="13" fill="#6B6258">予定はイメージです。推しの公式発表に合わせて書き直す</text></svg>
