<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 566" width="420" height="566" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="566" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">推し活予算の立て方</text>
<text x="20" y="64" font-size="12" fill="#6B6258">4つのステップで、使いすぎを防ぐ</text>
<line x1="52" y1="132" x2="52" y2="468" stroke="#16a34a" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="52" cy="132" r="24" fill="#16a34a"/><g transform="translate(40,120)"><rect x="2" y="4" width="20" height="19" rx="3" fill="#fff"/><rect x="4.5" y="10" width="15" height="10.5" rx="1" fill="#16a34a"/><path d="M7 1.5v5M17 1.5v5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><rect x="7" y="13" width="3.5" height="3" fill="#fff"/></g><rect x="92" y="88" width="314" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="116" font-size="17" fill="#241F1A" font-weight="800">1. 予定を書き出す</text><rect x="314" y="100" width="78" height="22" rx="11.0" fill="#DCF1E4"/><text x="353.0" y="114" font-size="12" fill="#15803D" font-weight="700" text-anchor="middle">まず1年分</text><circle cx="114" cy="139.1" r="3" fill="#16a34a"/><text x="124" y="144" font-size="14" fill="#241F1A">ツアー・発売日・FCの更新</text><circle cx="114" cy="163.1" r="3" fill="#16a34a"/><text x="124" y="168" font-size="14" fill="#241F1A">推しの誕生日・記念日も</text><circle cx="52" cy="244" r="24" fill="#16a34a"/><g transform="translate(40,232)"><path d="M1 5h22v5a2.5 2.5 0 0 0 0 5v5H1v-5a2.5 2.5 0 0 0 0-5z" fill="#fff"/><path d="M16 7v11" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="2 2"/></g><rect x="92" y="200" width="314" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="228" font-size="17" fill="#241F1A" font-weight="800">2. かかるものを分ける</text><rect x="350" y="212" width="42" height="22" rx="11.0" fill="#DCF1E4"/><text x="371.0" y="226" font-size="12" fill="#15803D" font-weight="700" text-anchor="middle">分類</text><circle cx="114" cy="251.1" r="3" fill="#16a34a"/><text x="124" y="256" font-size="14" fill="#241F1A">チケット・交通・宿</text><circle cx="114" cy="275.1" r="3" fill="#16a34a"/><text x="124" y="280" font-size="14" fill="#241F1A">グッズ・ごはん・配信</text><circle cx="52" cy="356" r="24" fill="#16a34a"/><g transform="translate(40,344)"><rect x="2" y="13" width="5" height="9" rx="1" fill="#fff"/><rect x="9.5" y="7" width="5" height="15" rx="1" fill="#fff"/><rect x="17" y="2" width="5" height="20" rx="1" fill="#fff"/></g><rect x="92" y="312" width="314" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="340" font-size="17" fill="#241F1A" font-weight="800">3. 月ごとにならす</text><rect x="338" y="324" width="54" height="22" rx="11.0" fill="#DCF1E4"/><text x="365.0" y="338" font-size="12" fill="#15803D" font-weight="700" text-anchor="middle">見通し</text><circle cx="114" cy="363.1" r="3" fill="#16a34a"/><text x="124" y="368" font-size="14" fill="#241F1A">出費が重なる月を先に知る</text><circle cx="114" cy="387.1" r="3" fill="#16a34a"/><text x="124" y="392" font-size="14" fill="#241F1A">前の月から少しずつ準備</text><circle cx="52" cy="468" r="24" fill="#16a34a"/><g transform="translate(40,456)"><ellipse cx="11.5" cy="13" rx="9.5" ry="7.5" fill="#fff"/><path d="M5 18.5V23h3.5v-3M15 19.5V23h3.5v-4.5" fill="#fff"/><rect x="9" y="5" width="6" height="2" rx="1" fill="#16a34a"/><path d="M20 10.5l3-1v4l-2.5.5" fill="#fff"/><circle cx="16" cy="11" r="1.2" fill="#16a34a"/></g><rect x="92" y="424" width="314" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="452" font-size="17" fill="#241F1A" font-weight="800">4. 予備をとっておく</text><rect x="350" y="436" width="42" height="22" rx="11.0" fill="#DCF1E4"/><text x="371.0" y="450" font-size="12" fill="#15803D" font-weight="700" text-anchor="middle">安心</text><circle cx="114" cy="475.1" r="3" fill="#16a34a"/><text x="124" y="480" font-size="14" fill="#241F1A">追加公演・急な発表に</text><circle cx="114" cy="499.1" r="3" fill="#16a34a"/><text x="124" y="504" font-size="14" fill="#241F1A">使わなければ次の推し活へ</text><text x="20" y="548" font-size="13" fill="#6B6258">値段は変わるので、見込みは公式の発表で確かめる</text></svg>
