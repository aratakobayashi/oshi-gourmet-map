<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 710" width="600" height="710" role="img" aria-label="LaLa arena TOKYO-BAYの座席のつくり" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>LaLa arena TOKYO-BAYの座席のつくり</title><rect width="600" height="710" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="28" fill="#241F1A" font-weight="700" text-anchor="start">座席のつくり（断面のイメージ）</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">座席の配置は公演ごとに変わります</text><rect x="20" y="118" width="560" height="300" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><path d="M40 400 L40 220 Q300 140 560 220 L560 400 Z" fill="#EEF2F7"/><path d="M40 220 Q300 140 560 220" fill="none" stroke="#9AA8BA" stroke-width="4"/><path d="M48 250 L180 300 L180 317 L48 283 Z" fill="#7A4FB5"/><path d="M552 250 L420 300 L420 317 L552 283 Z" fill="#7A4FB5"/><path d="M48 293 L200 343 L200 360 L48 327 Z" fill="#D9822B"/><path d="M552 293 L400 343 L400 360 L552 327 Z" fill="#D9822B"/><path d="M48 337 L220 387 L220 403 L48 370 Z" fill="#2F6FB5"/><path d="M552 337 L380 387 L380 403 L552 370 Z" fill="#2F6FB5"/><rect x="200" y="384" width="200" height="16" fill="#2E8B57"/><rect x="250" y="350" width="100" height="34" rx="4" fill="#3B3346"/><text x="300" y="373" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">ステージの例</text><rect x="30" y="438" width="28" height="28" rx="7" fill="#7A4FB5"/><text x="72" y="460" font-size="22" fill="#241F1A" font-weight="700" text-anchor="start">4F</text><text x="72" y="486" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">下段（1〜8列）と上段（9〜17列）</text><rect x="30" y="500" width="28" height="28" rx="7" fill="#D9822B"/><text x="72" y="522" font-size="22" fill="#241F1A" font-weight="700" text-anchor="start">3F</text><text x="72" y="548" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">VIPエリアと一部の座席</text><rect x="30" y="562" width="28" heigh