" stroke="#fff" stroke-width="4"/><line x1="372" y1="231" x2="380" y2="231.0074721979791" stroke="#2F6FB5" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="380" y="199.0074721979791" width="190" height="64" rx="12" fill="#fff" stroke="#2F6FB5" stroke-width="2.5"/><text x="390" y="226.0074721979791" font-size="19" fill="#2F6FB5" font-weight="700" text-anchor="start">JR東北本線 利府駅</text><text x="390" y="251.0074721979791" font-size="15" fill="#6B6258" font-weight="400" text-anchor="start">バス約10分・徒歩約45分</text><circle cx="372" cy="231" r="11" fill="#2F6FB5" stroke="#fff" stroke-width="4"/><rect x="20" y="542" width="560" height="70" rx="12" fill="#FBE6DD"/><text x="36" y="568" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">駅から遠い。利府駅からバスで約10分</text><text x="36" y="596" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">乗車券は利府駅まで買っておく</text></svg>