<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 534" width="600" height="534" role="img" aria-label="みずほPayPayドーム福岡と最寄り駅の位置関係" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>みずほPayPayドーム福岡と最寄り駅の位置関係</title><rect width="600" height="534" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="28" fill="#241F1A" font-weight="700" text-anchor="start">みずほPayPayドーム福岡と最寄り駅</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">北が上。位置関係のイメージです</text><path d="M560 30 L572 60 L560 53 L548 60 Z" fill="#241F1A"/><text x="560" y="80" font-size="16" fill="#241F1A" font-weight="700" text-anchor="middle">N</text><path d="M510 98 L530 98" stroke="#241F1A" stroke-width="3"/><text x="520.0500565073696" y="90" font-size="15" fill="#6B6258" font-weight="400" text-anchor="middle">100m</text><rect x="20" y="118" width="560" height="320" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><ellipse cx="228" cy="232" rx="26" ry="23" fill="#EEF2F7" stroke="#9AA8BA" stroke-width="3"/><ellipse cx="228" cy="232" rx="18" ry="16" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><ellipse cx="228" cy="232" rx="10" ry="9" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><rect x="158" y="261" width="141" height="32" rx="16" fill="#fff" stroke="#9AA8BA"/><text x="228.0000000002562" y="283.0796300610376" font-size="18" fill="#241F1A" font-weight="700" text-anchor="middle">みずほPayPay</text><line x1="372" y1="324" x2="380" y2="324.32036993896236" stroke="#2F6FB5" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="380" y="292.32036993896236" width="190" height="64" rx="12" fill="#fff" stroke="#2F6FB5" stroke-width="2.5"/><text x="390" y="319.32036993896236" font-size="16" fill="#2F6FB5" font-weight="700" text-anchor="start">地下鉄空港線 唐人町駅</text><text x="390" y="344.32036993896236" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">3番出口・徒歩約15分</text><circle cx="372" cy="324" r="11" fill="#2F6F