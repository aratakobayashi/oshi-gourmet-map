<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 604" width="420" height="604" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="604" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">持っていける？どこで確かめる？</text>
<text x="20" y="64" font-size="12" fill="#6B6258">決めているのは、主催者・会場・お店・航空会社</text>
<rect x="16" y="84" width="388" height="100" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="46" cy="124" r="20" fill="#EFE7FD"/><g transform="translate(34,112)"><rect x="10" y="10" width="5" height="13" rx="2" fill="#7c3aed"/><rect x="9" y="1" width="7" height="10" rx="3.5" fill="#7c3aed" opacity=".55"/></g><text x="76" y="116" font-size="16" fill="#241F1A" font-weight="800">うちわ・ペンライト</text><text x="76" y="138" font-size="13" fill="#6B6258">チケットやファンクラブのお知らせで</text><text x="76" y="168" font-size="13" fill="#6B6258">確かめる先</text><line x1="150" y1="163" x2="162" y2="163" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><path d="M160 156l8 7-8 7z" fill="#7c3aed"/><rect x="176" y="150" width="216" height="24" rx="12" fill="#7c3aed"/><text x="284" y="167" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">主催者の案内</text><rect x="16" y="194" width="388" height="100" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="46" cy="234" r="20" fill="#EFE7FD"/><g transform="translate(34,222)"><rect x="9.5" y="1" width="5" height="3" rx="1" fill="#7c3aed"/><path d="M9 4h6v2.5l2 2.5v13H7V9l2-2.5z" fill="#7c3aed"/><rect x="7" y="12" width="10" height="5" fill="#EFE7FD" opacity=".45"/></g><text x="76" y="226" font-size="16" fill="#241F1A" font-weight="800">飲み物・大きな荷物</text><text x="76" y="248" font-size="13" fill="#6B6258">会場の公式サイト・このサイトの会場ガイドで</text><text x="76" y="278" font-size="13" fill="#6B6258">確かめる先</text><line x1="150" y1="273" x2="162" y2="273" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><path d="M160 266l8 7-8 7z" fill="#7c3aed"/><rect x="176" y="260" width="216" height="24" rx="12" fill="#7c3aed"/><text x="284" y="277" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">会場のルール</text><rect x="16" y="304" width="388" height="100" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="46" cy="344" r="20" fill="#EFE7FD"/><g transform="translate(34,332)"><rect x="2" y="7" width="20" height="14" rx="3" fill="#7c3aed"/><rect x="8" y="4" width="8" height="4" rx="1" fill="#7c3aed"/><circle cx="12" cy="14" r="4" fill="#EFE7FD"/><circle cx="12" cy="14" r="2" fill="#7c3aed"/></g><text x="76" y="336" font-size="16" fill="#241F1A" font-weight="800">ぬい撮り・撮影</text><text x="76" y="358" font-size="13" fill="#6B6258">予約ページや店内の案内で</text><text x="76" y="388" font-size="13" fill="#6B6258">確かめる先</text><line x1="150" y1="383" x2="162" y2="383" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><path d="M160 376l8 7-8 7z" fill="#7c3aed"/><rect x="176" y="370" width="216" height="24" rx="12" fill="#7c3aed"/><text x="284" y="387" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">お店・カフェの案内</text><rect x="16" y="414" width="388" height="100" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="46" cy="454" r="20" fill="#EFE7FD"/><g transform="translate(34,442)"><rect x="2" y="6" width="18" height="12" rx="3" fill="#7c3aed"/><rect x="20.5" y="9.5" width="2.5" height="5" rx="1" fill="#7c3aed"/><path d="M12 8l-4 5h3l-1 4 4-5h-3z" fill="#EFE7FD"/></g><text x="76" y="446" font-size="16" fill="#241F1A" font-weight="800">モバイルバッテリー</text><text x="76" y="468" font-size="13" fill="#6B6258">飛行機に乗るときは機内持ち込みのみ</text><text x="76" y="498" font-size="13" fill="#6B6258">確かめる先</text><line x1="150" y1="493" x2="162" y2="493" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><path d="M160 486l8 7-8 7z" fill="#7c3aed"/><rect x="176" y="480" width="216" height="24" rx="12" fill="#7c3aed"/><text x="284" y="497" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">航空会社の決まり</text><rect x="16" y="528" width="388" height="58" rx="12" fill="#EFE7FD"/><text x="32" y="552" font-size="14" fill="#6D28D9" font-weight="800">同じ会場でも、公演によって決まりは</text><text x="32" y="573" font-size="14" fill="#6D28D9" font-weight="800">違います。毎回、最新の案内を確かめよう</text></svg>
