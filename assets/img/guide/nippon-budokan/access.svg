<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 534" width="600" height="534" role="img" aria-label="日本武道館と最寄り駅の位置関係" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>日本武道館と最寄り駅の位置関係</title><rect width="600" height="534" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="30" fill="#241F1A" font-weight="700" text-anchor="start">日本武道館と最寄り駅</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">北が上。位置関係のイメージです</text><path d="M560 30 L572 60 L560 53 L548 60 Z" fill="#241F1A"/><text x="560" y="80" font-size="16" fill="#241F1A" font-weight="700" text-anchor="middle">N</text><path d="M509 98 L530 98" stroke="#241F1A" stroke-width="3"/><text x="519.28973063672" y="90" font-size="15" fill="#6B6258" font-weight="400" text-anchor="middle">100m</text><rect x="20" y="118" width="560" height="320" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><ellipse cx="228" cy="270" rx="26" ry="23" fill="#EEF2F7" stroke="#9AA8BA" stroke-width="3"/><ellipse cx="228" cy="270" rx="18" ry="16" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><ellipse cx="228" cy="270" rx="10" ry="9" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><rect x="171" y="300" width="114" height="32" rx="16" fill="#fff" stroke="#9AA8BA"/><text x="228.0000000002758" y="321.5536566643358" font-size="18" fill="#241F1A" font-weight="700" text-anchor="middle">日本武道館</text><line x1="251" y1="218" x2="220" y2="218.32023705391" stroke="#2F6FB5" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="30" y="186.32023705391" width="190" height="64" rx="12" fill="#fff" stroke="#2F6FB5" stroke-width="2.5"/><text x="40" y="213.32023705391" font-size="19" fill="#2F6FB5" font-weight="700" text-anchor="start">地下鉄 九段下駅</text><text x="40" y="238.32023705391" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">2番出口</text><circle cx="251" cy="218" r="11" fill="#2F6FB5" stroke="#fff" stroke-width="4"/><line x1="372" y1="338" x2="380" y2="337.6797629459211" stroke="#2E8B57" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="380" y="305.6797629459211" width="190" height="64" rx="12" fill="#fff" stroke="#2E8B57" stroke-width="2.5"/><text x="390" y="332.6797629459211" font-size="19" fill="#2E8B57" font-weight="700" text-anchor="start">東京メトロ 竹橋駅</text><text x="390" y="357.6797629459211" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">1番出口</text><circle cx="372" cy="338" r="11" fill="#2E8B57" stroke="#fff" stroke-width="4"/><rect x="20" y="450" width="560" height="70" rx="12" fill="#FBE6DD"/><text x="36" y="476" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">九段下駅が混むときは4番出口を</text><text x="36" y="504" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">帰りは歩道橋を渡り1番・3番出口も</text></svg>