<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 524" width="600" height="524" role="img" aria-label="Aichi Sky Expoの座席のつくり" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>Aichi Sky Expoの座席のつくり</title><rect width="600" height="524" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="28" fill="#241F1A" font-weight="700" text-anchor="start">座席のつくり（断面のイメージ）</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">客席の並びは公演ごとに主催者が決めます</text><rect x="20" y="118" width="560" height="300" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="40" y="170" width="520" height="230" fill="#EEF2F7"/><path d="M40 170 L560 170" stroke="#9AA8BA" stroke-width="4"/><rect x="200" y="384" width="200" height="16" fill="#2E8B57"/><rect x="250" y="350" width="100" height="34" rx="4" fill="#3B3346"/><text x="300" y="373" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">ステージの例</text><rect x="30" y="438" width="28" height="28" rx="7" fill="#2E8B57"/><text x="72" y="460" font-size="22" fill="#241F1A" font-weight="700" text-anchor="start">展示ホール（平らな床）</text><text x="72" y="486" font-size="18" fill="#6B6258" font-weight="400" text-anchor="start">ホールA〜Fの6つ。各約10,000㎡</text></svg>