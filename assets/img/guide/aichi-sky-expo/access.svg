" stroke-width="4"/><rect x="20" y="450" width="560" height="70" rx="12" fill="#FBE6DD"/><text x="36" y="476" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">駅から会場までバリアフリー対応</text><text x="36" y="504" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">空港の連絡通路を通って歩く</text></svg>