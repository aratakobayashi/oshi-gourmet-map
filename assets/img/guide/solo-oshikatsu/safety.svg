<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 550" width="420" height="550" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="550" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">ひとりでも安心の4つの備え</text>
<text x="20" y="64" font-size="12" fill="#6B6258">ひとりだからこそ、先に決めておきたいこと</text>
<rect x="16" y="88" width="388" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="136" r="22" fill="#14b8a6"/><g transform="translate(40,124)"><path d="M12 1.5L23 11h-3v12H4V11H1z" fill="#fff"/><rect x="9.5" y="15" width="5" height="8" rx="1" fill="#14b8a6"/></g><text x="88" y="118" font-size="16" fill="#241F1A" font-weight="800">予定をだれかに伝える</text><text x="88" y="144" font-size="14" fill="#241F1A">行き先と帰る時間を、家族や</text><text x="88" y="166" font-size="14" fill="#241F1A">友だちに伝えておく</text><rect x="16" y="196" width="388" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="244" r="22" fill="#14b8a6"/><g transform="translate(40,232)"><circle cx="12" cy="12" r="10.5" fill="#fff"/><path d="M12 6v6.5l4 2.5" stroke="#14b8a6" stroke-width="2.4" fill="none" stroke-linecap="round"/></g><text x="88" y="226" font-size="16" fill="#241F1A" font-weight="800">帰りの時間を先に決める</text><text x="88" y="252" font-size="14" fill="#241F1A">終電・帰りの便を確かめて、</text><text x="88" y="274" font-size="14" fill="#241F1A">終演後の動きを決めておく</text><rect x="16" y="304" width="388" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="352" r="22" fill="#14b8a6"/><g transform="translate(40,340)"><rect x="5" y="1" width="14" height="22" rx="3" fill="#fff"/><rect x="7.5" y="4" width="9" height="14" rx="1" fill="#14b8a6"/><circle cx="12" cy="20.3" r="1.2" fill="#14b8a6"/></g><text x="88" y="334" font-size="16" fill="#241F1A" font-weight="800">居場所は「あとから」投稿</text><text x="88" y="360" font-size="14" fill="#241F1A">写真の背景からも場所はわかる</text><text x="88" y="382" font-size="14" fill="#241F1A">投稿は帰ってから・時間をずらして</text><rect x="16" y="412" width="388" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="52" cy="460" r="22" fill="#14b8a6"/><g transform="translate(40,448)"><path d="M1 5h22v5a2.5 2.5 0 0 0 0 5v5H1v-5a2.5 2.5 0 0 0 0-5z" fill="#fff"/><path d="M16 7v11" stroke="#14b8a6" stroke-width="1.6" stroke-dasharray="2 2"/></g><text x="88" y="442" font-size="16" fill="#241F1A" font-weight="800">チケットは正規のルートで</text><text x="88" y="468" font-size="14" fill="#241F1A">SNSの個人取引で先に送金しない</text><text x="88" y="490" font-size="14" fill="#241F1A">行けない時は公式のリセールで</text><text x="20" y="534" font-size="12" fill="#6B6258">出典：総務省「インターネットトラブル事例集」、国民生活センター</text></svg>
