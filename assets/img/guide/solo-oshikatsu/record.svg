-size="15" fill="#241F1A">推しと同じメニュー</text><line x1="84" y1="458" x2="378" y2="458" stroke="#E2D9CC" stroke-width="1.5" stroke-dasharray="4 4"/><text x="84" y="480" font-size="13" fill="#0F766E" font-weight="800">次に行きたい所</text><text x="84" y="506" font-size="15" fill="#241F1A">ロケ地のカフェ</text><line x1="84" y1="518" x2="378" y2="518" stroke="#E2D9CC" stroke-width="1.5" stroke-dasharray="4 4"/><g transform="translate(350,108)"><path d="M12 22S1.5 15 1.5 8.2A5.3 5.3 0 0 1 12 6a5.3 5.3 0 0 1 10.5 2.2C22.5 15 12 22 12 22z" fill="#14b8a6"/></g></svg>
