<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">推し活ノートの書き方（例）</text>
<text x="20" y="64" font-size="12" fill="#6B6258">1回分を1ページに。あとで読み返すと楽しい</text>
