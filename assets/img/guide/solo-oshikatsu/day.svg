<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 652" width="420" height="652" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="652" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">ひとり参戦の1日</text>
<text x="20" y="64" font-size="12" fill="#6B6258">出発から帰宅まで、5つの場面</text>
<line x1="52" y1="132" x2="52" y2="580" stroke="#14b8a6" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="52" cy="132" r="24" fill="#14b8a6"/><g transform="translate(40,120)"><rect x="5" y="1" width="14" height="22" rx="3" fill="#fff"/><rect x="7.5" y="4" width="9" height="14" rx="1" fill="#14b8a6"/><circle cx="12" cy="20.3" r="1.2" fill="#14b8a6"/></g><rect x="92" y="88" width="314" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="116" font-size="17" fill="#241F1A" font-weight="800">1. 出発前</text><rect x="350" y="100" width="42" height="22" rx="11.0" fill="#DCF4F2"/><text x="371.0" y="114" font-size="12" fill="#0F766E" font-weight="700" text-anchor="middle">準備</text><circle cx="114" cy="139.1" r="3" fill="#14b8a6"/><text x="124" y="144" font-size="14" fill="#241F1A">チケットが表示できるか確認</text><circle cx="114" cy="163.1" r="3" fill="#14b8a6"/><text x="124" y="168" font-size="14" fill="#241F1A">スマホと電池を満タンに</text><circle cx="52" cy="244" r="24" fill="#14b8a6"/><g transform="translate(40,232)"><path d="M8 8V6a4 4 0 0 1 8 0v2" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M3 8h18l-1.5 15h-15z" fill="#fff"/></g><rect x="92" y="200" width="314" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="228" font-size="17" fill="#241F1A" font-weight="800">2. 会場の近くに着いたら</text><rect x="350" y="212" width="42" height="22" rx="11.0" fill="#DCF4F2"/><text x="371.0" y="226" font-size="12" fill="#0F766E" font-weight="700" text-anchor="middle">到着</text><circle cx="114" cy="251.1" r="3" fill="#14b8a6"/><text x="124" y="256" font-size="14" fill="#241F1A">大きな荷物は先に預ける</text><circle cx="114" cy="275.1" r="3" fill="#14b8a6"/><text x="124" y="280" font-size="14" fill="#241F1A">入場やグッズの案内を見る</text><circle cx="52" cy="356" r="24" fill="#14b8a6"/><g transform="translate(40,344)"><path d="M1.5 11h21a10.5 10 0 0 1-21 0z" fill="#fff"/><path d="M14 9.5L21 2M10 9.5L17 1" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><rect x="8" y="20" width="8" height="3" rx="1" fill="#fff"/></g><rect x="92" y="312" width="314" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="340" font-size="17" fill="#241F1A" font-weight="800">3. 開演前</text><rect x="338" y="324" width="54" height="22" rx="11.0" fill="#DCF4F2"/><text x="365.0" y="338" font-size="12" fill="#0F766E" font-weight="700" text-anchor="middle">ごはん</text><circle cx="114" cy="363.1" r="3" fill="#14b8a6"/><text x="124" y="368" font-size="14" fill="#241F1A">推しが行ったお店で腹ごしらえ</text><circle cx="114" cy="387.1" r="3" fill="#14b8a6"/><text x="124" y="392" font-size="14" fill="#241F1A">混む時間をずらすと入りやすい</text><circle cx="52" cy="468" r="24" fill="#14b8a6"/><g transform="translate(40,456)"><rect x="4" y="1" width="16" height="18" rx="4" fill="#fff"/><rect x="6.5" y="4" width="11" height="6" rx="1.5" fill="#14b8a6"/><circle cx="8.5" cy="14.5" r="1.6" fill="#14b8a6"/><circle cx="15.5" cy="14.5" r="1.6" fill="#14b8a6"/><path d="M7 20l-2.5 3.5M17 20l2.5 3.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><rect x="92" y="424" width="314" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="452" font-size="17" fill="#241F1A" font-weight="800">4. 終演後</text><rect x="350" y="436" width="42" height="22" rx="11.0" fill="#DCF4F2"/><text x="371.0" y="450" font-size="12" fill="#0F766E" font-weight="700" text-anchor="middle">帰り</text><circle cx="114" cy="475.1" r="3" fill="#14b8a6"/><text x="124" y="480" font-size="14" fill="#241F1A">退場は係員の案内に従う</text><circle cx="114" cy="499.1" r="3" fill="#14b8a6"/><text x="124" y="504" font-size="14" fill="#241F1A">帰りは明るく人の多い道を</text><circle cx="52" cy="580" r="24" fill="#14b8a6"/><g transform="translate(40,568)"><rect x="3" y="1" width="18" height="22" rx="3" fill="#fff"/><path d="M7 7h10M7 11.5h10M7 16h6" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/></g><rect x="92" y="536" width="314" height="98" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="108" y="564" font-size="17" fill="#241F1A" font-weight="800">5. 帰ってから</text><rect x="350" y="548" width="42" height="22" rx="11.0" fill="#DCF4F2"/><text x="371.0" y="562" font-size="12" fill="#0F766E" font-weight="700" text-anchor="middle">記録</text><circle cx="114" cy="587.1" r="3" fill="#14b8a6"/><text x="124" y="592" font-size="14" fill="#241F1A">感想と行ったお店を記録</text><circle cx="114" cy="611.1" r="3" fill="#14b8a6"/><text x="124" y="616" font-size="14" fill="#241F1A">SNSへの投稿はこのタイミングで</text></svg>
