<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 552" width="420" height="552" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="552" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">ひとりで楽しむ推し活マップ</text>
<text x="20" y="64" font-size="12" fill="#6B6258">行きたい所へ、行きたい時に</text>
<rect x="16" y="88" width="192" height="138" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="50" cy="122" r="20" fill="#14b8a6"/><g transform="translate(38,110)"><rect x="8" y="1" width="8" height="13" rx="4" fill="#fff"/><path d="M4.5 11a7.5 7.5 0 0 0 15 0M12 18.5V23M8 23h8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><text x="78" y="128" font-size="16" fill="#241F1A" font-weight="800">ライブ・舞台</text><text x="32" y="166" font-size="14" fill="#241F1A">自分のペースで</text><text x="32" y="188" font-size="14" fill="#241F1A">公演に集中できる</text><rect x="212" y="88" width="192" height="138" rx="12" fill="#fff" stroke="#14b8a6" stroke-width="1"/><circle cx="246" cy="122" r="20" fill="#14b8a6"/><g transform="translate(234,110)"><path d="M1.5 11h21a10.5 10 0 0 1-21 0z" fill="#fff"/><path d="M14 9.5L21 2M10 9.5L17 1" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><rect x="8" y="20" width="8" height="3" rx="1" fill="#fff"/></g><text x="274" y="128" font-size="16" fill="#241F1A" font-weight="800">推しのお店</text><text x="228" y="166" font-size="14" fill="#241F1A">推しと同じ味を</text><text x="228" y="188" font-size="14" fill="#241F1A">ゆっくり味わう</text><rect x="228" y="194" width="136" height="22" rx="11.0" fill="#DCF4F2"/><text x="296.0" y="208" font-size="12" fill="#0F766E" font-weight="700" text-anchor="middle">このサイトで探せる</text><rect x="16" y="238" width="192" height="138" rx="12" fill="#fff" stroke="#14b8a6" stroke-width="1"/><circle cx="50" cy="272" r="20" fill="#14b8a6"/><g transform="translate(38,260)"><path d="M12 23s8-8.2 8-13.5a8 8 0 0 0-16 0C4 14.8 12 23 12 23z" fill="#fff"/><circle cx="12" cy="9.5" r="3.2" fill="#14b8a6"/></g><text x="78" y="278" font-size="16" fill="#241F1A" font-weight="800">聖地めぐり</text><text x="32" y="316" font-size="14" fill="#241F1A">ゆかりの場所を</text><text x="32" y="338" font-size="14" fill="#241F1A">好きな順にまわる</text><rect x="32" y="344" width="136" height="22" rx="11.0" fill="#DCF4F2"/><text x="100.0" y="358" font-size="12" fill="#0F766E" font-weight="700" text-anchor="middle">このサイトで探せる</text><rect x="212" y="238" width="192" height="138" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="246" cy="272" r="20" fill="#14b8a6"/><g transform="translate(234,260)"><rect x="1" y="3" width="22" height="16" rx="4" fill="#fff"/><path d="M10 7.5v7l6-3.5z" fill="#14b8a6"/><rect x="6" y="21" width="12" height="2" rx="1" fill="#fff"/></g><text x="274" y="278" font-size="16" fill="#241F1A" font-weight="800">配信・番組</text><text x="228" y="316" font-size="14" fill="#241F1A">見返して、好きな</text><text x="228" y="338" font-size="14" fill="#241F1A">場面を見つける</text><rect x="16" y="388" width="192" height="138" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="50" cy="422" r="20" fill="#14b8a6"/><g transform="translate(38,410)"><rect x="3" y="1" width="18" height="22" rx="3" fill="#fff"/><path d="M7 7h10M7 11.5h10M7 16h6" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/></g><text x="78" y="428" font-size="16" fill="#241F1A" font-weight="800">記録する</text><text x="32" y="466" font-size="14" fill="#241F1A">感想や行った店を</text><text x="32" y="488" font-size="14" fill="#241F1A">ノートに残す</text><rect x="212" y="388" width="192" height="138" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><circle cx="246" cy="422" r="20" fill="#14b8a6"/><g transform="translate(234,410)"><rect x="2" y="2" width="9" height="12" rx="2" fill="#fff"/><circle cx="17" cy="8" r="5.5" fill="#fff"/><rect x="5" y="16" width="16" height="6" rx="3" fill="#fff"/></g><text x="274" y="428" font-size="16" fill="#241F1A" font-weight="800">グッズ</text><text x="228" y="466" font-size="14" fill="#241F1A">飾る・並べる・</text><text x="228" y="488" font-size="14" fill="#241F1A">撮って楽しむ</text></svg>
