<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="420" height="560" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="560" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">ひとりで入りやすいお店の選び方</text>
<text x="20" y="64" font-size="12" fill="#6B6258">推しが行ったお店を、ひとりで楽しむために</text>
<rect x="16" y="86" width="388" height="236" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><path d="M16 98a12 12 0 0 1 12-12h364a12 12 0 0 1 12 12v24H16z" fill="#14b8a6"/><text x="32" y="111" font-size="16" fill="#fff" font-weight="800">行く前にチェック</text><g transform="translate(360,92)"><path d="M3 12.5l6 6L21 5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="32" y="138" width="16" height="16" rx="4" fill="#fff" stroke="#14b8a6" stroke-width="2"/><text x="58" y="152" font-size="15" fill="#241F1A" font-weight="700">カウンター席があるか</text><text x="58" y="172" font-size="13" fill="#6B6258">写真や紹介で席のつくりを見る</text><rect x="32" y="184" width="16" height="16" rx="4" fill="#fff" stroke="#14b8a6" stroke-width="2"/><text x="58" y="198" font-size="15" fill="#241F1A" font-weight="700">混む時間をずらす</text><text x="58" y="218" font-size="13" fill="#6B6258">食事どきの前後がねらい目</text><rect x="32" y="230" width="16" height="16" rx="4" fill="#fff" stroke="#14b8a6" stroke-width="2"/><text x="58" y="244" font-size="15" fill="#241F1A" font-weight="700">予約が必要か</text><text x="58" y="264" font-size="13" fill="#6B6258">お店の公式情報で確かめる</text><rect x="32" y="276" width="16" height="16" rx="4" fill="#fff" stroke="#14b8a6" stroke-width="2"/><text x="58" y="290" font-size="15" fill="#241F1A" font-weight="700">撮影のルール</text><text x="58" y="310" font-size="13" fill="#6B6258">お店の決まりにしたがう</text><rect x="16" y="336" width="388" height="200" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/><text x="32" y="366" font-size="16" fill="#241F1A" font-weight="800">このサイトで探すなら</text><rect x="32" y="384" width="108" height="62" rx="12" fill="#DCF4F2"/><text x="86" y="410" font-size="14" fill="#0F766E" font-weight="800" text-anchor="middle">ジャンルで</text><text x="86" y="432" font-size="14" fill="#0F766E" font-weight="800" text-anchor="middle">絞り込む</text><path d="M143 415h10m-5-5l5 5-5 5" fill="none" stroke="#14b8a6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="156" y="384" width="108" height="62" rx="12" fill="#DCF4F2"/><text x="210" y="410" font-size="14" fill="#0F766E" font-weight="800" text-anchor="middle">地図で</text><text x="210" y="432" font-size="14" fill="#0F766E" font-weight="800" text-anchor="middle">近くを見る</text><path d="M267 415h10m-5-5l5 5-5 5" fill="none" stroke="#14b8a6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="280" y="384" width="108" height="62" rx="12" fill="#DCF4F2"/><text x="334" y="410" font-size="14" fill="#0F766E" font-weight="800" text-anchor="middle">保存して</text><text x="334" y="432" font-size="14" fill="#0F766E" font-weight="800" text-anchor="middle">行く日に</text><text x="32" y="474" font-size="13" fill="#6B6258" font-weight="700">ひとりでも入りやすいジャンルの例</text><rect x="32" y="488" width="78" height="24" rx="12.0" fill="#fff"/><text x="71.0" y="504" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">ラーメン</text><rect x="32" y="488" width="78" height="24" rx="12" fill="none" stroke="#14b8a6" stroke-width="1.5"/><rect x="118" y="488" width="64" height="24" rx="12.0" fill="#fff"/><text x="150.0" y="504" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">カフェ</text><rect x="118" y="488" width="64" height="24" rx="12" fill="none" stroke="#14b8a6" stroke-width="1.5"/><rect x="190" y="488" width="92" height="24" rx="12.0" fill="#fff"/><text x="236.0" y="504" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">食事・定食</text><rect x="190" y="488" width="92" height="24" rx="12" fill="none" stroke="#14b8a6" stroke-width="1.5"/><rect x="290" y="488" width="50" height="24" rx="12.0" fill="#fff"/><text x="315.0" y="504" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">和食</text><rect x="290" y="488" width="50" height="24" rx="12" fill="none" stroke="#14b8a6" stroke-width="1.5"/></svg>
