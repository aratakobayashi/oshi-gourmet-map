<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 820" width="420" height="820" role="img" aria-label="終演後にその日のうちに帰れるかを考える流れ" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>終演後にその日のうちに帰れるかを考える流れ</title><rect width="420" height="820" rx="18" fill="#F7F3EC"/><text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">終演後、その日に帰れる？</text><text x="20" y="64" font-size="12" font-weight="400" fill="#6B6258" text-anchor="start">時刻は、鉄道会社・航空会社の公式の時刻表で</text><rect x="12" y="84" width="396" height="86" rx="12" fill="#fff" stroke="#E2D9CC"/><circle cx="46" cy="127.0" r="26" fill="#DBEAFE"/><g transform="translate(46,127.0) scale(0.8)"><path d="M-16 6 L16 6 L16 12 L-16 12 Z" fill="#2563eb"/><path d="M-10 6 L-4 -10 M10 6 L4 -10" stroke="#2563eb" stroke-width="2.5"/><path d="M0 -14 L2.5 -9 L8 -8.5 L4 -5 L5 0.5 L0 -2.5 L-5 0.5 L-4 -5 L-8 -8.5 L-2.5 -9 Z" fill="#F59E0B"/></g><circle cx="24" cy="98" r="11" fill="#2563eb"/><text x="24" y="103" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="86" y="112" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">終演の予定時刻</text><text x="86" y="136" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">主催者の案内で確かめる。アンコール</text><text x="86" y="156" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">や規制退場で、出るのが遅くなることも</text><line x1="210" y1="170" x2="210" y2="185" stroke="#B8AC9C" stroke-width="3"/><path d="M203 183 L217 183 L210 192 Z" fill="#B8AC9C"/><rect x="12" y="192" width="396" height="86" rx="12" fill="#fff" stroke="#E2D9CC"/><circle cx="46" cy="235.0" r="26" fill="#DBEAFE"/><g transform="translate(46,235.0) scale(0.8)"><circle cx="2" cy="-12" r="4" fill="#2563eb"/><path d="M1 -6 L-2 4 L4 14 M-2 4 L-8 14 M0 -4 L-8 0 M0 -4 L8 2" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="24" cy="206" r="11" fill="#2563eb"/><text x="24" y="211" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="86" y="220" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">会場 → 最寄り駅</text><text x="86" y="244" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">歩く時間は会場ガイドで。終演後は</text><text x="86" y="264" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">駅が混み、入場を制限することも</text><line x1="210" y1="278" x2="210" y2="293" stroke="#B8AC9C" stroke-width="3"/><path d="M203 291 L217 291 L210 300 Z" fill="#B8AC9C"/><rect x="12" y="300" width="396" height="86" rx="12" fill="#fff" stroke="#E2D9CC"/><circle cx="46" cy="343.0" r="26" fill="#DBEAFE"/><g transform="translate(46,343.0) scale(0.8)"><path d="M-20 8 L-20 -6 Q-20 -16 -8 -16 L10 -16 Q22 -16 22 -2 L22 8 Z" fill="#DBEAFE" stroke="#2563eb" stroke-width="2.5"/><path d="M6 -14 Q18 -14 20 -3 L6 -3 Z" fill="#2563eb"/><rect x="-14" y="-10" width="8" height="6" rx="1.5" fill="#2563eb"/><rect x="-3" y="-10" width="8" height="6" rx="1.5" fill="#2563eb"/><line x1="-20" y1="2" x2="22" y2="2" stroke="#2563eb" stroke-width="2"/><circle cx="-12" cy="12" r="3" fill="#2563eb"/><circle cx="12" cy="12" r="3" fill="#2563eb"/><line x1="-24" y1="17" x2="26" y2="17" stroke="#2563eb" stroke-width="2"/></g><circle cx="24" cy="314" r="11" fill="#2563eb"/><text x="24" y="319" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="86" y="328" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">最寄り駅 → 乗り換える駅</text><text x="86" y="352" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">公式の時刻表で、発車時刻と</text><text x="86" y="372" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">乗り換えにかかる時間を確かめる</text><line x1="210" y1="386" x2="210" y2="401" stroke="#B8AC9C" stroke-width="3"/><path d="M203 399 L217 399 L210 408 Z" fill="#B8AC9C"/><rect x="12" y="408" width="396" height="86" rx="12" fill="#fff" stroke="#E2D9CC"/><circle cx="46" cy="451.0" r="26" fill="#DBEAFE"/><g transform="translate(46,451.0) scale(0.8)"><path d="M-22 0 Q-22 -4 -14 -4 L18 -4 Q24 -4 24 0 Q24 4 18 4 L-14 4 Q-22 4 -22 0 Z" fill="#DBEAFE" stroke="#2563eb" stroke-width="2.5"/><path d="M2 -4 L-8 -18 L-2 -18 L12 -4 Z" fill="#2563eb"/><path d="M2 4 L-8 18 L-2 18 L12 4 Z" fill="#2563eb"/><path d="M-18 -4 L-22 -12 L-17 -12 L-12 -4 Z" fill="#2563eb"/></g><circle cx="24" cy="422" r="11" fill="#2563eb"/><text x="24" y="427" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="86" y="436" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">最終の新幹線・飛行機</text><text x="86" y="460" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">飛行機は空港までの移動と、搭乗手続き</text><text x="86" y="480" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">の締め切り（予約の案内）まで見込む</text><line x1="210" y1="494" x2="210" y2="509" stroke="#B8AC9C" stroke-width="3"/><path d="M203 507 L217 507 L210 516 Z" fill="#B8AC9C"/><path d="M210 516 L380 560 L210 604 L40 560 Z" fill="#2563eb"/><text x="210" y="556" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">ゆとりをもって</text><text x="210" y="578" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">間に合う？</text><path d="M110 582 L110 620" stroke="#2563eb" stroke-width="3"/><path d="M310 582 L310 620" stroke="#B8AC9C" stroke-width="3"/><text x="96" y="608" font-size="13" font-weight="800" fill="#2563eb" text-anchor="end">はい</text><text x="324" y="608" font-size="13" font-weight="800" fill="#6B6258" text-anchor="start">いいえ</text><rect x="12" y="620" width="190" height="104" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="107" y="650" font-size="16" font-weight="800" fill="#2563eb" text-anchor="middle">日帰りにする</text><text x="107" y="676" font-size="13" font-weight="400" fill="#241F1A" text-anchor="middle">帰りのきっぷも</text><text x="107" y="696" font-size="13" font-weight="400" fill="#241F1A" text-anchor="middle">先に押さえる</text><rect x="218" y="620" width="190" height="104" rx="12" fill="#fff" stroke="#B8AC9C" stroke-width="2"/><text x="313" y="650" font-size="16" font-weight="800" fill="#241F1A" text-anchor="middle">泊まる・夜行バス</text><text x="313" y="676" font-size="13" font-weight="400" fill="#241F1A" text-anchor="middle">宿は会場の近くか、</text><text x="313" y="696" font-size="13" font-weight="400" fill="#241F1A" text-anchor="middle">翌朝の便に乗りやすい駅に</text><rect x="12" y="740" width="396" height="68" rx="12" fill="#DBEAFE"/><g transform="translate(40,774) scale(0.9)"><rect x="-9" y="-15" width="18" height="30" rx="4" fill="#fff" stroke="#1e40af" stroke-width="2.5"/><line x1="-4" y1="10" x2="4" y2="10" stroke="#1e40af" stroke-width="2.5" stroke-linecap="round"/><path d="M-4 -7 L4 -7 M-4 -2 L4 -2 M-4 3 L1 3" stroke="#1e40af" stroke-width="2"/></g><text x="64" y="768" font-size="14" font-weight="700" fill="#1e40af" text-anchor="start">ぎりぎりの計画は避けて、間に合わな</text><text x="64" y="790" font-size="14" font-weight="700" fill="#1e40af" text-anchor="start">かったときの宿や手段も考えておく</text></svg>
