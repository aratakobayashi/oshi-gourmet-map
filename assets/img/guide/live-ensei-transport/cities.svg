<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 664" width="420" height="664" role="img" aria-label="主な遠征先の都市と、新幹線の駅・空港" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>主な遠征先の都市と、新幹線の駅・空港</title><rect width="420" height="664" rx="18" fill="#F7F3EC"/><text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">主な遠征先と玄関口</text><text x="20" y="64" font-size="12" font-weight="400" fill="#6B6258" text-anchor="start">路線図ふうのイメージ。実際の距離とは違います</text><path d="M50 124 L50 204" stroke="#2563eb" stroke-width="4" stroke-dasharray="6 7"/><rect x="33" y="150.0" width="34" height="28" rx="8" fill="#F7F3EC"/><g transform="translate(50,164.0) scale(0.6)"><path d="M-22 0 Q-22 -4 -14 -4 L18 -4 Q24 -4 24 0 Q24 4 18 4 L-14 4 Q-22 4 -22 0 Z" fill="#DBEAFE" stroke="#2563eb" stroke-width="2.5"/><path d="M2 -4 L-8 -18 L-2 -18 L12 -4 Z" fill="#2563eb"/><path d="M2 4 L-8 18 L-2 18 L12 4 Z" fill="#2563eb"/><path d="M-18 -4 L-22 -12 L-17 -12 L-12 -4 Z" fill="#2563eb"/></g><path d="M50 204 L50 524" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="124" r="12" fill="#fff" stroke="#2563eb" stroke-width="5"/><line x1="64" y1="124" x2="84" y2="124" stroke="#E2D9CC" stroke-width="2"/><rect x="84" y="92" width="324" height="68" rx="12" fill="#fff" stroke="#E2D9CC"/><text x="98" y="119" font-size="17" font-weight="800" fill="#2563eb" text-anchor="start">札幌</text><text x="140" y="119" font-size="12" font-weight="700" fill="#6B6258" text-anchor="start">会場ガイド 2</text><text x="98" y="144" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">札幌駅・新千歳空港</text><circle cx="50" cy="204" r="12" fill="#fff" stroke="#2563eb" stroke-width="5"/><line x1="64" y1="204" x2="84" y2="204" stroke="#E2D9CC" stroke-width="2"/><rect x="84" y="172" width="324" height="68" rx="12" fill="#fff" stroke="#E2D9CC"/><text x="98" y="199" font-size="17" font-weight="800" fill="#2563eb" text-anchor="start">仙台</text><text x="140" y="199" font-size="12" font-weight="700" fill="#6B6258" text-anchor="start">会場ガイド 2</text><text x="98" y="224" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">仙台駅・仙台空港</text><circle cx="50" cy="284" r="12" fill="#fff" stroke="#2563eb" stroke-width="5"/><line x1="64" y1="284" x2="84" y2="284" stroke="#E2D9CC" stroke-width="2"/><rect x="84" y="252" width="324" height="68" rx="12" fill="#fff" stroke="#E2D9CC"/><text x="98" y="279" font-size="17" font-weight="800" fill="#2563eb" text-anchor="start">東京</text><text x="140" y="279" font-size="12" font-weight="700" fill="#6B6258" text-anchor="start">会場ガイド 14（首都圏）</text><text x="98" y="304" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">東京駅・品川駅・羽田空港</text><circle cx="50" cy="364" r="12" fill="#fff" stroke="#2563eb" stroke-width="5"/><line x1="64" y1="364" x2="84" y2="364" stroke="#E2D9CC" stroke-width="2"/><rect x="84" y="332" width="324" height="68" rx="12" fill="#fff" stroke="#E2D9CC"/><text x="98" y="359" font-size="17" font-weight="800" fill="#2563eb" text-anchor="start">名古屋</text><text x="157" y="359" font-size="12" font-weight="700" fill="#6B6258" text-anchor="start">会場ガイド 4（静岡を含む）</text><text x="98" y="384" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">名古屋駅・中部国際空港</text><circle cx="50" cy="444" r="12" fill="#fff" stroke="#2563eb" stroke-width="5"/><line x1="64" y1="444" x2="84" y2="444" stroke="#E2D9CC" stroke-width="2"/><rect x="84" y="412" width="324" height="68" rx="12" fill="#fff" stroke="#E2D9CC"/><text x="98" y="439" font-size="17" font-weight="800" fill="#2563eb" text-anchor="start">大阪</text><text x="140" y="439" font-size="12" font-weight="700" fill="#6B6258" text-anchor="start">会場ガイド 4（神戸を含む）</text><text x="98" y="464" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">新大阪駅・伊丹空港・関西空港</text><circle cx="50" cy="524" r="12" fill="#fff" stroke="#2563eb" stroke-width="5"/><line x1="64" y1="524" x2="84" y2="524" stroke="#E2D9CC" stroke-width="2"/><rect x="84" y="492" width="324" height="68" rx="12" fill="#fff" stroke="#E2D9CC"/><text x="98" y="519" font-size="17" font-weight="800" fill="#2563eb" text-anchor="start">福岡</text><text x="140" y="519" font-size="12" font-weight="700" fill="#6B6258" text-anchor="start">会場ガイド 2</text><text x="98" y="544" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">博多駅・福岡空港</text><line x1="24" y1="580" x2="60" y2="580" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/><text x="70" y="585" font-size="13" font-weight="700" fill="#241F1A" text-anchor="start">新幹線でつながる</text><line x1="214" y1="580" x2="250" y2="580" stroke="#2563eb" stroke-width="4" stroke-dasharray="6 7"/><text x="260" y="585" font-size="13" font-weight="700" fill="#241F1A" text-anchor="start">飛行機が中心</text><text x="24" y="616" font-size="13" font-weight="400" fill="#6B6258" text-anchor="start">札幌までは新幹線が通っていません（2026年</text><text x="24" y="636" font-size="13" font-weight="400" fill="#6B6258" text-anchor="start">10月現在）。本州からは飛行機が選びやすい街です</text></svg>
