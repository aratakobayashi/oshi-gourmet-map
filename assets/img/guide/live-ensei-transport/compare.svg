x="243.75" cy="292.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="257.75" cy="292.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="292.25" cy="292.0" r="5.5" fill="#2563eb"/><circle cx="306.25" cy="292.0" r="5.5" fill="#2563eb"/><circle cx="320.25" cy="292.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="354.75" cy="292.0" r="5.5" fill="#2563eb"/><circle cx="368.75" cy="292.0" r="5.5" fill="#2563eb"/><circle cx="382.75" cy="292.0" r="5.5" fill="#2563eb"/><line x1="13" y1="318" x2="407" y2="318" stroke="#E2D9CC"/><text x="24" y="341" font-size="14" font-weight="800" fill="#241F1A" text-anchor="start">時間の自由さ</text><text x="24" y="360" font-size="12" font-weight="400" fill="#6B6258" text-anchor="start">出発の時刻を選べる</text><circle cx="167.25" cy="344.0" r="5.5" fill="#2563eb"/><circle cx="181.25" cy="344.0" r="5.5" fill="#2563eb"/><circle cx="195.25" cy="344.0" r="5.5" fill="#2563eb"/><circle cx="229.75" cy="344.0" r="5.5" fill="#2563eb"/><circle cx="243.75" cy="344.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="257.75" cy="344.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="292.25" cy="344.0" r="5.5" fill="#2563eb"/><circle cx="306.25" cy="344.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="320.25" cy="344.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="354.75" cy="344.0" r="5.5" fill="#2563eb"/><circle cx="368.75" cy="344.0" r="5.5" fill="#2563eb"/><circle cx="382.75" cy="344.0" r="5.5" fill="#2563eb"/><rect x="13" y="370" width="394" height="52" fill="#FBF8F3"/><line x1="13" y1="370" x2="407" y2="370" stroke="#E2D9CC"/><text x="24" y="393" font-size="14" font-weight="800" fill="#241F1A" text-anchor="start">遅れにくさ</text><text x="24" y="412" font-size="12" font-weight="400" fill="#6B6258" text-anchor="start">天気・渋滞の影響</text><circle cx="167.25" cy="396.0" r="5.5" fill="#2563eb"/><circle cx="181.25" cy="396.0" r="5.5" fill="#2563eb"/><circle cx="195.25" cy="396.0" r="5.5" fill="#2563eb"/><circle cx="229.75" cy="396.0" r="5.5" fill="#2563eb"/><circle cx="243.75" cy="396.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="257.75" cy="396.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="292.25" cy="396.0" r="5.5" fill="#2563eb"/><circle cx="306.25" cy="396.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="320.25" cy="396.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="354.75" cy="396.0" r="5.5" fill="#2563eb"/><circle cx="368.75" cy="396.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="382.75" cy="396.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><line x1="13" y1="422" x2="407" y2="422" stroke="#E2D9CC"/><text x="24" y="445" font-size="14" font-weight="800" fill="#241F1A" text-anchor="start">夜のうちに移動</text><text x="24" y="464" font-size="12" font-weight="400" fill="#6B6258" text-anchor="start">寝ているあいだに着く</text><circle cx="167.25" cy="448.0" r="5.5" fill="#2563eb"/><circle cx="181.25" cy="448.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="195.25" cy="448.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="229.75" cy="448.0" r="5.5" fill="#2563eb"/><circle cx="243.75" cy="448.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="257.75" cy="448.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="292.25" cy="448.0" r="5.5" fill="#2563eb"/><circle cx="306.25" cy="448.0" r="5.5" fill="#2563eb"/><circle cx="320.25" cy="448.0" r="5.5" fill="#2563eb"/><circle cx="354.75" cy="448.0" r="5.5" fill="#2563eb"/><circle cx="368.75" cy="448.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><circle cx="382.75" cy="448.0" r="5" fill="#fff" stroke="#C9BFB1" stroke-width="1.5"/><text x="20" y="504" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">ひとことメモ</text><rect x="12" y="518" width="396" height="58" rx="12" fill="#fff" stroke="#E2D9CC"/><rect x="12" y="518" width="8" height="58" rx="4" fill="#2563eb"/><text x="32" y="542" font-size="14" font-weight="800" fill="#2563eb" text-anchor="start">新幹線</text><text x="110" y="542" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">駅が街の中心にあり、本数も多い。</text><text x="110" y="562" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">大きな荷物は座席の予約が要る路線も</text><rect x="12" y="584" width="396" height="58" rx="12" fill="#fff" stroke="#E2D9CC"/><rect x="12" y="584" width="8" height="58" rx="4" fill="#2563eb"/><text x="32" y="608" font-size="14" font-weight="800" fill="#2563eb" text-anchor="start">飛行機</text><text x="110" y="608" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">遠い街へ速い。空港から会場までの</text><text x="110" y="628" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">移動と、搭乗手続きの時間も見込む</text><rect x="12" y="650" width="396" height="58" rx="12" fill="#fff" stroke="#E2D9CC"/><rect x="12" y="650" width="8" height="58" rx="4" fill="#2563eb"/><text x="32" y="674" font-size="14" font-weight="800" fill="#2563eb" text-anchor="start">高速バス</text><text x="110" y="674" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">夜行便なら寝ているあいだに着く。</text><text x="110" y="694" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">渋滞や天気で遅れることがある</text><rect x="12" y="716" width="396" height="58" rx="12" fill="#fff" stroke="#E2D9CC"/><rect x="12" y="716" width="8" height="58" rx="4" fill="#2563eb"/><text x="32" y="740" font-size="14" font-weight="800" fill="#2563eb" text-anchor="start">車</text><text x="110" y="740" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">荷物も時間も自由。駐車場のない</text><text x="110" y="760" font-size="13" font-weight="400" fill="#241F1A" text-anchor="start">会場もあるので、会場ガイドで確認</text></svg>
