<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 674" width="420" height="674" role="img" aria-label="交通手段ごとの予約開始の時期" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>交通手段ごとの予約開始の時期</title><rect width="420" height="674" rx="18" fill="#F7F3EC"/><text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">予約はいつから？</text><text x="20" y="64" font-size="12" font-weight="400" fill="#6B6258" text-anchor="start">各社公式の案内より（2026年10月10日確認）</text><line x1="62" y1="102" x2="62" y2="568" stroke="#2563eb" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/><rect x="12" y="92" width="100" height="82" rx="12" fill="#2563eb"/><text x="62" y="129.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1年前</text><text x="62" y="151.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5時30分</text><rect x="120" y="92" width="288" height="82" rx="12" fill="#fff" stroke="#E2D9CC"/><g transform="translate(146,114) scale(0.55)"><path d="M-20 8 L-20 -6 Q-20 -16 -8 -16 L10 -16 Q22 -16 22 -2 L22 8 Z" fill="#DBEAFE" stroke="#2563eb" stroke-width="2.5"/><path d="M6 -14 Q18 -14 20 -3 L6 -3 Z" fill="#2563eb"/><rect x="-14" y="-10" width="8" height="6" rx="1.5" fill="#2563eb"/><rect x="-3" y="-10" width="8" height="6" rx="1.5" fill="#2563eb"/><line x1="-20" y1="2" x2="22" y2="2" stroke="#2563eb" stroke-width="2"/><circle cx="-12" cy="12" r="3" fill="#2563eb"/><circle cx="12" cy="12" r="3" fill="#2563eb"/><line x1="-24" y1="17" x2="26" y2="17" stroke="#2563eb" stroke-width="2"/></g><text x="166" y="119" font-size="14" font-weight="800" fill="#241F1A" text-anchor="start">東海道・山陽・九州新幹線</text><text x="132" y="142" font-size="14" font-weight="800" fill="#241F1A" text-anchor="start">EXサービスの「1年前予約」</text><text x="132" y="162" font-size="12" font-weight="400" fill="#6B6258" text-anchor="start">一部の商品。列車と座席は1か月前に確定</text><rect x="12" y="188" width="100" height="68" rx="12" fill="#2563eb"/><text x="62" y="218.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">360日前</text><text x="62" y="240.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">0時</text><rect x="120" y="188" width="288" height="68" rx="12" fill="#fff" stroke="#E2D9CC"/><g transform="translate(146,210) scale(0.55)"><path d="M-22 0 Q-22 -4 -14 -4 L18 -4 Q24 -4 24 0 Q24 4 18 4 L-14 4 Q-22 4 -22 0 Z" fill="#DBEAFE" stroke="#2563eb" stroke-width="2.5"/><path d="M2 -4 L-8 -18 L-2 -18 L12 -4 Z" fill="#2563eb"/><path d="M2 4 L-8 18 L-2 18 L12 4 Z" fill="#2563eb"/><path d="M-18 -4 L-22 -12 L-17 -12 L-12 -4 Z" fill="#2563eb"/></g><text x="166" y="215" font-size="15" font-weight="800" fill="#241F1A" text-anchor="start">JAL 国内線</text><text x="132" y="240" font-size="12" font-weight="400" fill="#6B6258" text-anchor="start">一部の運賃を除く（JAL公式）</text><rect x="12" y="270" width="100" height="68" rx="12" fill="#2563eb"/><text x="62" y="300.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">355日前</text><text x="62" y="322.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">9時</text><rect x="120" y="270" width="288" height="68" rx="12" fill="#fff" stroke="#E2D9CC"/><g transform="translate(146,292) scale(0.55)"><path d="M-22 0 Q-22 -4 -14 -4 L18 -4 Q24 -4 24 0 Q24 4 18 4 L-14 4 Q-22 4 -22 0 Z" fill="#DBEAFE" stroke="#2563eb" stroke-width="2.5"/><path d="M2 -4 L-8 -18 L-2 -18 L12 -4 Z" fill="#2563eb"/><path d="M2 4 L-8 18 L-2 18 L12 4 Z" fill="#2563eb"/><path d="M-18 -4 L-22 -12 L-17 -12 L-12 -4 Z" fill="#2563eb"/></g><text x="166" y="297" font-size="15" font-weight="800" fill="#241F1A" text-anchor="start">ANA 国内線</text><text x="132" y="322" font-size="12" font-weight="400" fill="#6B6258" text-anchor="start">一部の割引運賃を除く（ANA公式）</text><rect x="12" y="352" width="100" height="68" rx="12" fill="#2563eb"/><text x="62" y="382.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1か月前の</text><text x="62" y="404.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1週間前 14時</text><rect x="120" y="352" width="288" height="68" rx="12" fill="#fff" stroke="#E2D9CC"/><g transform="translate(146,374) scale(0.55)"><path d="M-20 8 L-20 -6 Q-20 -16 -8 -16 L10 -16 Q22 -16 22 -2 L22 8 Z" fill="#DBEAFE" stroke="#2563eb" stroke-width="2.5"/><path d="M6 -14 Q18 -14 20 -3 L6 -3 Z" fill="#2563eb"/><rect x="-14" y="-10" width="8" height="6" rx="1.5" fill="#2563eb"/><rect x="-3" y="-10" width="8" height="6" rx="1.5" fill="#2563eb"/><line x1="-20" y1="2" x2="22" y2="2" stroke="#2563eb" stroke-width="2"/><circle cx="-12" cy="12" r="3" fill="#2563eb"/><circle cx="12" cy="12" r="3" fill="#2563eb"/><line x1="-24" y1="17" x2="26" y2="17" stroke="#2563eb" stroke-width="2"/></g><text x="166" y="379" font-size="15" font-weight="800" fill="#241F1A" text-anchor="start">えきねっとの「事前受付」</text><text x="132" y="404" font-size="12" font-weight="400" fill="#6B6258" text-anchor="start">JR東海・JR四国・JR九州の区間を含むと対象外</text><rect x="12" y="434" width="100" height="68" rx="12" fill="#2563eb"/><text x="62" y="464.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1か月前</text><text x="62" y="486.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">10時</text><rect x="120" y="434" width="288" height="68" rx="12" fill="#fff" stroke="#E2D9CC"/><g transform="translate(146,456) scale(0.55)"><path d="M-20 8 L-20 -6 Q-20 -16 -8 -16 L10 -16 Q22 -16 22 -2 L22 8 Z" fill="#DBEAFE" stroke="#2563eb" stroke-width="2.5"/><path d="M6 -14 Q18 -14 20 -3 L6 -3 Z" fill="#2563eb"/><rect x="-14" y="-10" width="8" height="6" rx="1.5" fill="#2563eb"/><rect x="-3" y="-10" width="8" height="6" rx="1.5" fill="#2563eb"/><line x1="-20" y1="2" x2="22" y2="2" stroke="#2563eb" stroke-width="2"/><circle cx="-12" cy="12" r="3" fill="#2563eb"/><circle cx="12" cy="12" r="3" fill="#2563eb"/><line x1="-24" y1="17" x2="26" y2="17" stroke="#2563eb" stroke-width="2"/></g><text x="166" y="461" font-size="15" font-weight="800" fill="#241F1A" text-anchor="start">JRの指定席の発売</text><text x="132" y="486" font-size="12" font-weight="400" fill="#6B6258" text-anchor="start">全国一斉。事前受付の手配もここから</text><rect x="12" y="516" width="100" height="68" rx="12" fill="#B8AC9C"/><text x="62" y="546.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">路線</text><text x="62" y="568.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">ごと</text><rect x="120" y="516" width="288" height="68" rx="12" fill="#fff" stroke="#E2D9CC"/><g transform="translate(146,538) scale(0.55)"><rect x="-22" y="-16" width="44" height="28" rx="5" fill="#DBEAFE" stroke="#B8AC9C" stroke-width="2.5"/><rect x="-17" y="-11" width="9" height="8" rx="1.5" fill="#B8AC9C"/><rect x="-5" y="-11" width="9" height="8" rx="1.5" fill="#B8AC9C"/><rect x="7" y="-11" width="10" height="8" rx="1.5" fill="#B8AC9C"/><circle cx="-12" cy="13" r="4" fill="#B8AC9C"/><circle cx="12" cy="13" r="4" fill="#B8AC9C"/></g><text x="166" y="543" font-size="15" font-weight="800" fill="#241F1A" text-anchor="start">高速バス</text><text x="132" y="568" font-size="12" font-weight="400" fill="#6B6258" text-anchor="start">バス会社の予約サイトで発売日を確かめる</text><rect x="12" y="598" width="396" height="58" rx="12" fill="#DBEAFE"/><text x="26" y="623" font-size="13" font-weight="700" fill="#1e40af" text-anchor="start">チケットの当落が出る前でも、取消の条件を</text><text x="26" y="643" font-size="13" font-weight="700" fill="#1e40af" text-anchor="start">確かめたうえで早めに押さえる考え方もあります</text></svg>
