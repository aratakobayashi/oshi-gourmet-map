<rect x="20" y="114" width="380" height="12" fill="#DBEAFE"/>
<rect x="20" y="90" width="380" height="96" rx="12" fill="none" stroke="#E2D9CC"/>
<circle cx="42" cy="108" r="11" fill="#2563eb"/>
<text x="42" y="113" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Q</text>
<text x="62" y="114" font-size="15" font-weight="800" fill="#241F1A" text-anchor="start">周りの目が気になる</text>
<circle cx="42" cy="147" r="11" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="42" y="152" font-size="14" font-weight="800" fill="#2563eb" text-anchor="middle">A</text>
<text x="62" y="152" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">推し活に性別は関係ありません</text>
<text x="62" y="174" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">人に話すかどうかは自分で決めてOK</text>
<rect x="20" y="198" width="380" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/>
<rect x="20" y="198" width="380" height="36" rx="12" fill="#DBEAFE"/>
<rect x="20" y="222" width="380" height="12" fill="#DBEAFE"/>
<rect x="20" y="198" width="380" height="96" rx="12" fill="none" stroke="#E2D9CC"/>
<circle cx="42" cy="216" r="11" fill="#2563eb"/>
<text x="42" y="221" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Q</text>
<text x="62" y="222" font-size="15" font-weight="800" fill="#241F1A" text-anchor="start">一人でライブに行ってもいい？</text>
<circle cx="42" cy="255" r="11" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="42" y="260" font-size="14" font-weight="800" fill="#2563eb" text-anchor="middle">A</text>
<text x="62" y="260" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">一人での参加ももちろん楽しめます</text>
<text x="62" y="282" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">申し込み方法は主催者の案内で確認</text>
<rect x="20" y="306" width="380" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/>
<rect x="20" y="306" width="380" height="36" rx="12" fill="#DBEAFE"/>
<rect x="20" y="330" width="380" height="12" fill="#DBEAFE"/>
<rect x="20" y="306" width="380" height="96" rx="12" fill="none" stroke="#E2D9CC"/>
<circle cx="42" cy="324" r="11" fill="#2563eb"/>
<text x="42" y="329" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Q</text>
<text x="62" y="330" font-size="15" font-weight="800" fill="#241F1A" text-anchor="start">グッズは何を買えばいい？</text>
<circle cx="42" cy="363" r="11" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="42" y="368" font-size="14" font-weight="800" fill="#2563eb" text-anchor="middle">A</text>
<text x="62" y="368" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">ふだん使うものから一つ選ぶ</text>
<text x="62" y="390" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">公式ショップ・公式通販で買う</text>
<rect x="20" y="414" width="380" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/>
<rect x="20" y="414" width="380" height="36" rx="12" fill="#DBEAFE"/>
<rect x="20" y="438" width="380" height="12" fill="#DBEAFE"/>
<rect x="20" y="414" width="380" height="96" rx="12" fill="none" stroke="#E2D9CC"/>
<circle cx="42" cy="432" r="11" fill="#2563eb"/>
<text x="42" y="437" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Q</text>
<text x="62" y="438" font-size="15" font-weight="800" fill="#241F1A" text-anchor="start">お金をかけすぎないか心配</text>
<circle cx="42" cy="471" r="11" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="42" y="476" font-size="14" font-weight="800" fill="#2563eb" text-anchor="middle">A</text>
<text x="62" y="476" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">月の推し活の予算を先に決める</text>
<text x="62" y="498" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">チケットは公式の販売ルートで</text>
</svg>
