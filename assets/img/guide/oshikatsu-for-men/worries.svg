<circle cx="42" cy="336" r="11" fill="#2563eb"/>
<text x="42" y="341" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Q</text>
<text x="62" y="342" font-size="15" font-weight="800" fill="#241F1A" text-anchor="start">グッズは何を買えばいい？</text>
<circle cx="42" cy="375" r="11" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="42" y="380" font-size="14" font-weight="800" fill="#2563eb" text-anchor="middle">A</text>
<text x="62" y="380" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">ふだん使うものから一つ選ぶ</text>
<text x="62" y="402" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">公式ショップ・公式通販で買う</text>
