<circle cx="42" cy="222" r="11" fill="#2563eb"/>
<text x="42" y="227" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Q</text>
<text x="62" y="228" font-size="15" font-weight="800" fill="#241F1A" text-anchor="start">一人でライブに行ってもいい？</text>
<circle cx="42" cy="261" r="11" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="42" y="266" font-size="14" font-weight="800" fill="#2563eb" text-anchor="middle">A</text>
<text x="62" y="266" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">一人での参加ももちろん楽しめます</text>
<text x="62" y="288" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">申し込み方法は主催者の案内で確認</text>
<rect x="20" y="318" width="380" height="102" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/>
