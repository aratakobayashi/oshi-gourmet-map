<circle cx="42" cy="450" r="11" fill="#2563eb"/>
<text x="42" y="455" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Q</text>
<text x="62" y="456" font-size="15" font-weight="800" fill="#241F1A" text-anchor="start">お金をかけすぎないか心配</text>
<circle cx="42" cy="489" r="11" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="42" y="494" font-size="14" font-weight="800" fill="#2563eb" text-anchor="middle">A</text>
<text x="62" y="494" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">月の推し活の予算を先に決める</text>
<text x="62" y="516" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">チケットは公式の販売ルートで</text>
</svg>
