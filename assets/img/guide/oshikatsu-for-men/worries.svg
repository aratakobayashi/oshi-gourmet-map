<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 530" width="420" height="530" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="530" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">はじめるときの不安と考え方</text>
<text x="20" y="64" font-size="12" fill="#6B6258">推しグルメ巡礼MAP 編集部の考え</text>
<rect x="20" y="90" width="380" height="96" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/>
