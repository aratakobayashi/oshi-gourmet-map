<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 652" width="600" height="652" role="img" aria-label="ぴあアリーナMMと最寄り駅の位置関係" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>ぴあアリーナMMと最寄り駅の位置関係</title><rect width="600" height="652" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="30" fill="#241F1A" font-weight="700" text-anchor="start">ぴあアリーナMMと最寄り駅</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">北が上。位置関係のイメージです</text><path d="M560 30 L572 60 L560 53 L548 60 Z" fill="#241F1A"/><text x="560" y="80" font-size="16" fill="#241F1A" font-weight="700" text-anchor="middle">N</text><path d="M440 98 L530 98" stroke="#241F1A" stroke-width="3"/><text x="485.14719569054796" y="90" font-size="15" fill="#6B6258" font-weight="400" text-anchor="middle">500m</text><rect x="20" y="118" width="560" height="438" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><ellipse cx="308" cy="394" rx="26" ry="23" fill="#EEF2F7" stroke="#9AA8BA" stroke-width="3"/><ellipse cx="308" cy="394" rx="18" ry="16" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><ellipse cx="308" cy="394" rx="10" ry="9" fill="none" stroke="#C8D2DE" stroke-width="1.5"/><rect x="242" y="423" width="131" height="32" rx="16" fill="#fff" stroke="#9AA8BA"/><text x="307.8591263122469" y="445.2776011823121" font-size="15" fill="#241F1A" font-weight="700" text-anchor="middle">ぴあアリーナMM</text><line x1="228" y1="188" x2="220" y2="187.99999999992923" stroke="#7A4FB5" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="30" y="155.99999999992923" width="190" height="64" rx="12" fill="#fff" stroke="#7A4FB5" stroke-width="2.5"/><text x="40" y="182.99999999992923" font-size="19" fill="#7A4FB5" font-weight="700" text-anchor="start">JR・各線 横浜駅</text><text x="40" y="207.99999999992923" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">東口・徒歩18分</text><line x1="287" y1="225" x2="220" y2="261.99999999992923" stroke="#2E8B57" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="30" y="229.99999999992923" width="190" height="64" rx="12" fill="#fff" stroke="#2E8B57" stroke-width="2.5"/><text x="40" y="256.99999999992923" font-size="14" fill="#2E8B57" font-weight="700" text-anchor="start">みなとみらい線 新高島駅</text><text x="40" y="281.99999999992923" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">2番出口・徒歩8分</text><circle cx="228" cy="188" r="11" fill="#7A4FB5" stroke="#fff" stroke-width="4"/><circle cx="287" cy="225" r="11" fill="#2E8B57" stroke="#fff" stroke-width="4"/><line x1="372" y1="343" x2="380" y2="343.4537197551478" stroke="#2F6FB5" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="380" y="311.4537197551478" width="190" height="64" rx="12" fill="#fff" stroke="#2F6FB5" stroke-width="2.5"/><text x="390" y="338.4537197551478" font-size="11" fill="#2F6FB5" font-weight="700" text-anchor="start">みなとみらい線 みなとみらい駅</text><text x="390" y="363.4537197551478" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">1番出口・徒歩7分</text><line x1="364" y1="487" x2="380" y2="486.85907921675766" stroke="#D9822B" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="380" y="454.85907921675766" width="190" height="64" rx="12" fill="#fff" stroke="#D9822B" stroke-width="2.5"/><text x="390" y="481.85907921675766" font-size="19" fill="#D9822B" font-weight="700" text-anchor="start">JR 桜木町駅</text><text x="390" y="506.85907921675766" font-size="16" fill="#6B6258" font-weight="400" text-anchor="start">東口（北改札）徒歩7分</text><circle cx="372" cy="343" r="11" fill="#2F6FB5" stroke="#fff" stroke-width="4"/><circle cx="364" cy="487" r="11" fill="#D9822B" stroke="#fff" stroke-width="4"/><rect x="20" y="568" width="560" height="70" rx="12" fill="#FBE6DD"/><text x="36" y="594" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">駐車場・駐輪場はない。公共交通機関で</text><text x="36" y="622" font-size="19" fill="#C2532F" font-weight="700" text-anchor="start">桜木町駅からは2Fペデストリアンデッキへ</text></svg>