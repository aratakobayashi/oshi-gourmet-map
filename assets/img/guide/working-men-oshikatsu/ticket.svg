<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 482" width="420" height="482" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="482" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">チケットのきほん</text>
<text x="20" y="64" font-size="12" fill="#6B6258">国民生活センターの注意喚起（2026年10月6日）から</text>
<rect x="20" y="90" width="380" height="66" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/>
<rect x="36" y="110.0" width="26" height="26" rx="6" fill="#fff" stroke="#475569" stroke-width="2.4"/>
<path d="M40 123.0L46 130.0L59 116.0" stroke="#475569" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="119" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">正規の販売ルートで買う</text>
<text x="76" y="141" font-size="14" font-weight="400" fill="#6B6258" text-anchor="start">主催者・プレイガイド・ファンクラブ・公式</text>
<rect x="20" y="166" width="380" height="66" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/>
<rect x="36" y="186.0" width="26" height="26" rx="6" fill="#fff" stroke="#475569" stroke-width="2.4"/>
<path d="M40 199.0L46 206.0L59 192.0" stroke="#475569" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="195" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">販売サイトを確かめる</text>
<text x="76" y="217" font-size="14" font-weight="400" fill="#6B6258" text-anchor="start">転売仲介サイトではないか、運営者は誰か</text>
<rect x="20" y="242" width="380" height="66" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/>
<rect x="36" y="262.0" width="26" height="26" rx="6" fill="#fff" stroke="#475569" stroke-width="2.4"/>
<path d="M40 275.0L46 282.0L59 268.0" stroke="#475569" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="271" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">公式のルールを確認する</text>
<text x="76" y="293" font-size="14" font-weight="400" fill="#6B6258" text-anchor="start">転売チケットは入場できないことがある</text>
<rect x="20" y="318" width="380" height="66" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/>
<rect x="36" y="338.0" width="26" height="26" rx="6" fill="#fff" stroke="#475569" stroke-width="2.4"/>
<path d="M40 351.0L46 358.0L59 344.0" stroke="#475569" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="347" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">譲るときは公式のリセールで</text>
<text x="76" y="369" font-size="14" font-weight="400" fill="#6B6258" text-anchor="start">利益目的の不正転売は法律で禁止</text>
<rect x="20" y="404" width="380" height="58" rx="12" fill="#475569" stroke="#475569" stroke-width="1"/>
<g><rect x="42" y="420" width="16" height="26" rx="3" fill="#fff"/><rect x="44" y="423" width="12" height="17" rx="1.5" fill="#475569"/><circle cx="50" cy="443" r="1.3" fill="#475569"/></g>
<text x="76" y="430" font-size="16" font-weight="800" fill="#fff" text-anchor="start">困ったら 消費者ホットライン 188</text>
<text x="76" y="450" font-size="14" font-weight="400" fill="#fff" text-anchor="start">近くの消費生活センターなどにつながる</text>
</svg>
