<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740" role="img" aria-label="日産スタジアムに行く日の準備" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif"><title>日産スタジアムに行く日の準備</title><rect width="600" height="740" rx="24" fill="#F7F2EA"/><text x="30" y="58" font-size="30" fill="#241F1A" font-weight="700" text-anchor="start">当日の準備 4つ</text><text x="30" y="92" font-size="20" fill="#6B6258" font-weight="400" text-anchor="start">日産スタジアム公式サイトの案内より</text><rect x="20" y="118" width="560" height="140" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="20" y="118" width="8" height="140" rx="4" fill="#C2532F"/><g transform="translate(90,190) scale(.9)"><rect x="-30" y="-38" width="60" height="64" rx="12" fill="#DCEBFA" stroke="#2F6FB5" stroke-width="3"/><rect x="-22" y="-28" width="44" height="22" rx="4" fill="#fff" stroke="#2F6FB5" stroke-width="2"/><circle cx="-14" cy="12" r="5" fill="#2F6FB5"/><circle cx="14" cy="12" r="5" fill="#2F6FB5"/><path d="M-20 26 L-30 42 M20 26 L30 42" stroke="#2F6FB5" stroke-width="4"/></g><text x="150" y="164" font-size="24" fill="#C2532F" font-weight="700" text-anchor="start">公共交通機関で</text><text x="150" y="204" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">イベント時は周辺道路が</text><text x="150" y="234" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">混雑。駐車場も満車に</text><rect x="20" y="272" width="560" height="140" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="20" y="272" width="8" height="140" rx="4" fill="#2F6FB5"/><g transform="translate(90,344) scale(.9)"><path d="M-36 -26 L-14 -38 Q0 -28 14 -38 L36 -26 L28 -6 L18 -10 L18 38 L-18 38 L-18 -10 L-28 -6 Z" fill="#EDE6F7" stroke="#7A4FB5" stroke-width="3"/></g><text x="150" y="318" font-size="24" fill="#2F6FB5" font-weight="700" text-anchor="start">1階席前方は雨具を</text><text x="150" y="358" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">屋根は1階席19列目以降と</text><text x="150" y="388" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">2階席。傘は使わない</text><rect x="20" y="426" width="560" height="140" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="20" y="426" width="8" height="140" rx="4" fill="#2E8B57"/><g transform="translate(90,498) scale(.9)"><rect x="-40" y="-26" width="80" height="52" rx="8" fill="#FBE6DD" stroke="#C2532F" stroke-width="3"/><rect x="-40" y="-14" width="80" height="10" fill="#C2532F"/><rect x="-30" y="8" width="24" height="8" rx="2" fill="#C2532F"/></g><text x="150" y="472" font-size="24" fill="#2E8B57" font-weight="700" text-anchor="start">電子マネーは事前チャージ</text><text x="150" y="512" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">売店はカード・電子マネー可</text><text x="150" y="542" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">チャージ機は場内にない</text><rect x="20" y="580" width="560" height="140" rx="18" fill="#FFFFFF" stroke="#E2D9CC"/><rect x="20" y="580" width="8" height="140" rx="4" fill="#7A4FB5"/><g transform="translate(90,652) scale(.9)"><rect x="-30" y="-30" width="60" height="70" rx="10" fill="#D8F0E2" stroke="#2E8B57" stroke-width="3"/><path d="M-12 -30 L-12 -44 L12 -44 L12 -30" fill="none" stroke="#2E8B57" stroke-width="4"/><circle cx="-18" cy="44" r="5" fill="#2E8B57"/><circle cx="18" cy="44" r="5" fill="#2E8B57"/></g><text x="150" y="626" font-size="24" fill="#7A4FB5" font-weight="700" text-anchor="start">荷物の預かりは主催者次第</text><text x="150" y="666" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">スーツケースの扱いは</text><text x="150" y="696" font-size="20" fill="#241F1A" font-weight="400" text-anchor="start">主催者に確かめる</text></svg>