<circle cx="50" cy="218" r="18" fill="#db2777"/>
<polygon points="50.0,206.0 53.1,213.8 61.4,214.3 54.9,219.6 57.1,227.7 50.0,223.2 42.9,227.7 45.1,219.6 38.6,214.3 46.9,213.8" fill="#fff"/>
<text x="80" y="220" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">親しい友達</text>
<circle cx="86" cy="239" r="2.6" fill="#db2777"/>
<text x="95" y="244" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">選んだ人だけにストーリーズなどを公開</text>
