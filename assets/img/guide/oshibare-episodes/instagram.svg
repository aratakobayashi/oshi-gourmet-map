<text x="95" y="562" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">相手のコメントはその人にだけ表示</text>
<circle cx="86" cy="578" r="2.6" fill="#db2777"/>
<text x="95" y="583" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">既読やオンライン状態が相手に見えない</text>
