<text x="80" y="122" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">非公開アカウント</text>
<circle cx="86" cy="141" r="2.6" fill="#db2777"/>
<text x="95" y="146" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">承認したフォロワーだけが</text>
