<text x="80" y="416" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">ミュート</text>
<rect x="322.0" y="399" width="66.0" height="22" rx="11" fill="#FCE7F3"/>
<text x="355.0" y="415" font-size="12" font-weight="700" fill="#db2777" text-anchor="middle">通知なし</text>
<circle cx="86" cy="435" r="2.6" fill="#db2777"/>
<text x="95" y="440" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">相手の投稿・ストーリーズを画面から外す</text>
