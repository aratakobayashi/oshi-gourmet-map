<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="420" height="620" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="620" rx="18" fill="#F7F3EC"/>
