<g><path d="M37 316Q50 304 63 316Q50 328 37 316z" fill="#fff"/><circle cx="50" cy="316" r="4.5" fill="#db2777"/><line x1="39" y1="326" x2="61" y2="306" stroke="#db2777" stroke-width="5"/><line x1="39" y1="326" x2="61" y2="306" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="80" y="318" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">ストーリーズを非表示</text>
