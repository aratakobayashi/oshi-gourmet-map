<circle cx="50" cy="512" r="18" fill="#db2777"/>
<g><circle cx="50" cy="512" r="11" fill="none" stroke="#fff" stroke-width="3"/><line x1="42.5" y1="519.5" x2="57.5" y2="504.5" stroke="#fff" stroke-width="3"/></g>
<text x="80" y="514" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">制限</text>
<circle cx="86" cy="533" r="2.6" fill="#db2777"/>
<text x="95" y="538" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">相手のコメントはその人にだけ表示</text>
<circle cx="86" cy="554" r="2.6" fill="#db2777"/>
<text x="95" y="559" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">既読やオンライン状態が相手に見えない</text>
