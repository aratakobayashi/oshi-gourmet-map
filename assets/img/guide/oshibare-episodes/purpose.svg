<text x="76" y="122" font-size="16" font-weight="800" fill="#241F1A" text-anchor="start">知り合いに見つかりにくく</text>
<circle cx="82" cy="143" r="2.6" fill="#db2777"/>
<text x="92" y="148" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">X：ポストを非公開にする</text>
<circle cx="82" cy="165" r="2.6" fill="#db2777"/>
