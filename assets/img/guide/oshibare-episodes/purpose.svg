<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 538" width="420" height="538" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="538" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="22" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">目的別：使えるSNSの設定</text>
<text x="20" y="64" font-size="12" fill="#6B6258">X・Instagramの公式ヘルプで確かめた機能</text>
<rect x="20" y="90" width="380" height="116" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/>
<circle cx="48" cy="116" r="17" fill="#db2777"/>
