<circle cx="82" cy="187" r="2.6" fill="#db2777"/>
<text x="92" y="192" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">Instagram：非公開アカウント</text>
<rect x="20" y="216" width="380" height="94" rx="12" fill="#fff" stroke="#E2D9CC" stroke-width="1"/>
<circle cx="48" cy="242" r="17" fill="#db2777"/>
