<circle cx="82" cy="373" r="2.6" fill="#db2777"/>
<text x="92" y="378" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">X：ミュート・キーワードのミュート</text>
<circle cx="82" cy="395" r="2.6" fill="#db2777"/>
<text x="92" y="400" font-size="14" font-weight="400" fill="#241F1A" text-anchor="start">Instagram：投稿・ストーリーズのミュート</text>
