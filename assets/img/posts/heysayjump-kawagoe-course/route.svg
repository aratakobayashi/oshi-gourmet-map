<text x="46" y="115" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">発</text>
<text x="72" y="115" font-size="15" font-weight="800" fill="#241F1A">本川越駅</text>
<text x="72" y="152" font-size="12.5" fill="#6B6258">↓ 徒歩で北へ</text>
