<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 762" width="420" height="762" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="762" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="21" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">小江戸川越 歩く順番</text>
<text x="20" y="64" font-size="12" fill="#6B6258">本川越駅から北へ歩く一例。行きたいお店を選んで回ってください</text>
