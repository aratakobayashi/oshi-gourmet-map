<text x="78" y="708" font-size="12.5" fill="#6B6258">元町2丁目（菓子屋横丁）・第164回</text>
<text x="20" y="746" font-size="12" fill="#6B6258">住所はお店の公式サイトなどで確かめたもの（町名まで）</text>
