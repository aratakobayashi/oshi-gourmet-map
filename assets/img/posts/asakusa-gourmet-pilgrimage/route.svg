<rect x="320.0" y="537" width="68.0" height="22" rx="11" fill="#d9480f" fill-opacity=".12"/>
<text x="354.0" y="553" font-size="12.5" font-weight="700" fill="#d9480f" text-anchor="middle">おにぎり</text>
<text x="78" y="576" font-size="12.5" fill="#6B6258">浅草3丁目・Snow Man（2024年9月）</text>
<text x="20" y="614" font-size="12" fill="#6B6258">住所は推しグルメ巡礼MAPのデータより</text>
