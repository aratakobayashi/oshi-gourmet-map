<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 630" width="420" height="630" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<rect width="420" height="630" rx="18" fill="#F7F3EC"/>
<text x="20" y="42" font-size="21" font-weight="800" fill="#241F1A" font-family="'Hiragino Mincho ProN','Noto Serif CJK JP','Noto Serif JP',serif">浅草の聖地 歩く順番</text>
<text x="20" y="64" font-size="12" fill="#6B6258">雷門から北へ歩く一例。行きたいお店を選んで回ってください</text>
<line x1="46" y1="110" x2="46" y2="548" stroke="#d9480f" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9"/>
<rect x="32" y="96" width="28" height="28" rx="6" fill="#241F1A"/>
<text x="46" y="115" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">発</text>
<text x="72" y="115" font-size="15" font-weight="800" fill="#241F1A">浅草駅（雷門のあたり）</text>
<rect x="64" y="136" width="336" height="58" rx="12" fill="#fff" stroke="#E2D9CC"/>
<circle cx="46" cy="156" r="15" fill="#d9480f"/>
