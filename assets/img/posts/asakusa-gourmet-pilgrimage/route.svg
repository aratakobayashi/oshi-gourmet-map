<text x="78" y="162" font-size="16" font-weight="800" fill="#241F1A">浅草むぎとろ本店</text>
<rect x="320.0" y="145" width="68.0" height="22" rx="11" fill="#d9480f" fill-opacity=".12"/>
<text x="354.0" y="161" font-size="12.5" font-weight="700" fill="#d9480f" text-anchor="middle">むぎとろ</text>
<text x="78" y="184" font-size="12.5" fill="#6B6258">雷門2丁目・Snow Man（2026年4月）</text>
<text x="72" y="218" font-size="12.5" fill="#6B6258">↓ 徒歩</text>
