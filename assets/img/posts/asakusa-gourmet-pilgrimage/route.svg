<text x="78" y="358" font-size="16" font-weight="800" fill="#241F1A">てっぱん大吉</text>
<rect x="320.0" y="341" width="68.0" height="22" rx="11" fill="#d9480f" fill-opacity=".12"/>
<text x="354.0" y="357" font-size="12.5" font-weight="700" fill="#d9480f" text-anchor="middle">もんじゃ</text>
<text x="78" y="380" font-size="12.5" fill="#6B6258">浅草1丁目・よにの #490（2026年1月）</text>
