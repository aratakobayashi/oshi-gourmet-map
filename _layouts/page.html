---
layout: default
---
<div class="wrap" style="max-width:820px">
  <ol class="crumbs" aria-label="パンくずリスト"><li><a href="{{ '/' | relative_url }}">ホーム</a></li><li aria-current="page">{{ page.heading | default: page.title }}</li></ol>
  <h1 class="page-title">{{ page.heading | default: page.title }}</h1>
  <div class="prose" style="margin-top:16px">{{ content }}</div>
  {%- if page.updated %}<p class="meta" style="margin-top:32px">最終更新日：{{ page.updated | date: "%Y年%-m月%-d日" }}</p>{% endif %}
</div>
