<!DOCTYPE html>
<html lang="ja">
<head>
  {% include head.html %}
</head>
<body class="{{ page.body_class | default: layout.body_class }}">
  {% include header.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}
  {% include bottom-nav.html %}

  {%- if page.js_data %}
  {% include js-data.html %}
  {%- endif %}
  <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
  {%- for s in page.scripts %}
  <script src="{{ s | relative_url }}" defer></script>
  {%- endfor %}
</body>
</html>
